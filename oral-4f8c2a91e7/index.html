<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<title>Live Transcribe</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1a1a1a; --muted: #8a8a85; --card: #ffffff;
    --accent: #e5484d; --border: #e4e4e0; --answer: #2f5bd3; --answer-txt: #1f3f9e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111112; --fg: #ededed; --muted: #77777a; --card: #1b1b1d; --border: #2a2a2d; --answer: #3d63d8; --answer-txt: #a9c0ff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
  }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    height: 100dvh; -webkit-user-select: none; user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  main { height: 100%; display: flex; flex-direction: column; gap: 12px; }
  #transcript {
    flex: 1; min-height: 0; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 20px; line-height: 1.2; font-weight: 600;
    white-space: pre-wrap; overflow-wrap: normal;
    display: flex; align-items: center;
  }
  #text { width: 100%; }
  #text.tiny { overflow-wrap: anywhere; }
  #text:empty::before { content: attr(data-ph); color: var(--muted); font-weight: 500; }
  .interim { color: var(--muted); }
  .side { display: flex; align-items: center; justify-content: center; gap: 16px; }
  #mic {
    width: 88px; height: 88px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: var(--fg); color: var(--bg); display: grid; place-items: center;
    transition: transform .15s, background .2s; touch-action: manipulation;
  }
  #mic:active { transform: scale(.95); }
  #mic:disabled { opacity: .35; }
  #mic.on { background: var(--accent); color: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)} 70%{box-shadow:0 0 0 16px rgba(229,72,77,0)} 100%{box-shadow:0 0 0 0 rgba(229,72,77,0)} }
  #clear {
    background: transparent; color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 14px; font: inherit; font-size: .85rem;
    min-height: 44px; touch-action: manipulation;
  }
  #ask {
    background: transparent; color: var(--answer-txt); border: 2px solid var(--answer);
    border-radius: 999px; padding: 10px 14px; font: inherit; font-size: .9rem; font-weight: 600;
    min-height: 48px; touch-action: manipulation;
  }
  #ask:active { transform: scale(.96); }
  #ask.on { background: var(--answer); color: #fff; }
  #text.answer { color: var(--answer-txt); }
  #status { color: var(--muted); font-size: .8rem; text-align: center; min-height: 1.2em; }
  #status.err { color: var(--accent); }

  /* iPhone à l'horizontale : texte à gauche, commandes en colonne à droite */
  @media (orientation: landscape) {
    main { flex-direction: row; }
    .side { flex-direction: column; width: 104px; flex: none; gap: 12px; }
    #mic { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<main>
  <div id="transcript"><div id="text"></div></div>
  <div class="side">
    <button id="mic" aria-label="Start / stop listening">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="clear">Clear</button>
    <button id="ask" aria-pressed="false">Answer</button>
    <div id="status"></div>
  </div>
</main>
<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = (id) => document.getElementById(id);
  const box = $('transcript'), text = $('text'), status = $('status'), mic = $('mic');

  const FATAL = ['not-allowed', 'service-not-allowed', 'audio-capture'];
  const MIN_PX = 18;
  const MAX_RESTARTS = 3;      // relances auto par vocal (chaque relance = nouvelle session iOS)
  const STALL_MS = 5000;       // iOS peut se figer sans onend : on relance après 5 s sans résultat
  const MAX_CLIP_MS = 25000;   // vocaux ≤ 20 s : arrêt de sécurité

  let committed = '';   // texte des sessions précédentes (après une coupure iOS)
  let sessFinal = '', sessInterim = '';
  let listening = false, running = false, rec = null;
  let dropNext = false, freeRestart = false, restarts = 0;
  let retryDelay = 250, sessionStart = 0;
  let restartTimer = null, stallTimer = null, clipTimer = null;
  let wakeLock = null, curPx = 999, errMsg = '';
  const RELAIS = 'https://oral-reponse.dictees-d9709349.workers.dev';
  let answer = '', answering = false, ctrl = null;   // réponse IA affichée à la place de la question
  // V2 : on n'affiche jamais la question, seulement la réponse (déclenchée après un silence)
  const AUTO_MS = 1800;
  let v2 = false, autoTimer = null;
  // mémoire de l'échange : contexte, questions, réponses (remise à zéro par Clear)
  let history = [], conv = 0;
  try { v2 = localStorage.getItem('oral-v2') === '1'; } catch {}

  // V2 mains libres : le micro reste ouvert, on ignore ce qui ressemble à la réponse affichée (moi qui la lis)
  const QWORDS = new Set(['why', 'what', 'how', 'who', 'when', 'where', 'which', 'whose', 'explain', 'example', 'really']);
  const words = (s) => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
  function isEcho(q) {
    const refs = history.filter((m) => m.role === 'assistant' && !/^OK\.?$/i.test(m.content)).slice(-2).map((m) => m.content);
    if (answering) refs.push(answer);
    const a = words(refs.join(' '));
    const h = words(q);
    if (h.length < 3) return !h.some((w) => QWORDS.has(w));   // « so yeah », « um okay » : bruit
    if (!a.length) return false;
    const uni = new Set(a), bi = new Set(a.slice(1).map((w, i) => a[i] + ' ' + w));
    const uHit = h.filter((w) => uni.has(w)).length / h.length;
    const hb = h.slice(1).map((w, i) => h[i] + ' ' + w);
    const bHit = hb.filter((b) => bi.has(b)).length / hb.length;
    return bHit >= 0.4 || uHit >= 0.8;
  }
  const heard = () => join(join(committed, sessFinal), sessInterim).trim();

  // fin d'une prise de parole : on repart à zéro sans couper l'écoute, puis question ou écho ?
  function endSegment() {
    const q = heard();
    committed = ''; sessFinal = ''; sessInterim = '';
    if (running) { dropNext = true; freeRestart = true; try { rec.abort(); } catch {} }
    if (!q) return;
    if (isEcho(q)) { say('You ✓'); return; }
    ask(q);
  }

  function join(a, b) {
    b = b.trim();
    if (!b) return a;
    return a ? a + ' ' + b : b;
  }

  // plus grande taille où toute la phrase tient ; pendant un vocal on ne fait que rétrécir (pas de saut)
  function fit(grow = !listening && !answering) {
    const cs = getComputedStyle(box);
    const maxH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const maxW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const cap = Math.max(MIN_PX, Math.floor(maxH / 1.2));
    text.classList.remove('tiny');
    let lo = MIN_PX, hi = Math.min(grow ? cap : curPx, cap) + 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      text.style.fontSize = mid + 'px';
      if (text.scrollHeight <= maxH && text.scrollWidth <= maxW) lo = mid; else hi = mid;
    }
    text.style.fontSize = (curPx = lo) + 'px';
    text.classList.toggle('tiny', text.scrollWidth > maxW);   // mot trop long : on le coupe
  }

  function render() {
    if (errMsg) { text.textContent = errMsg; fit(true); return; }   // erreur affichée en grand
    const showAnswer = answering || answer;
    text.classList.toggle('answer', !!showAnswer);
    if (showAnswer) { text.textContent = answer.trim() || '…'; fit(); return; }
    if (v2) {
      text.textContent = '';
      text.dataset.ph = listening ? 'Listening…'
        : history.length ? 'Tap the mic for the next question.'
        : 'Answer mode: tap the mic, read the context, then ask the questions.';
      fit(true); return;
    }
    text.dataset.ph = 'Tap the mic and speak…';
    text.textContent = join(committed, sessFinal);
    if (sessInterim.trim()) {
      const span = document.createElement('span');
      span.className = 'interim';
      span.textContent = (text.textContent ? ' ' : '') + sessInterim.trim();
      text.appendChild(span);
    }
    fit();
  }
  new ResizeObserver(() => fit(true)).observe(box);   // rotation, barre Safari

  function say(msg, err = false) { status.textContent = msg; status.classList.toggle('err', err); }

  // écran allumé pendant l'écoute
  async function lockScreen() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      const l = await navigator.wakeLock.request('screen');
      if (listening && !wakeLock) wakeLock = l; else l.release();
    } catch {}
  }
  function unlockScreen() { try { wakeLock?.release(); } catch {} wakeLock = null; }
  // iOS exige un geste pour reprendre le verrou : on retente au prochain toucher
  document.addEventListener('touchend', () => { if (listening && !wakeLock) lockScreen(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && listening) { wakeLock = null; lockScreen(); }
  });

  // pas de zoom (pincer, double-tap)
  ['gesturestart', 'gesturechange', 'dblclick'].forEach((t) =>
    document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));

  function launch() {
    if (!listening || running) return;
    sessionStart = Date.now();
    try { rec.start(); } catch {}
  }

  if (!window.isSecureContext) {
    errMsg = "The microphone requires HTTPS.";
    mic.disabled = true;
  } else if (!SR) {
    errMsg = "Speech recognition is not available here. Open the link directly in Safari (not Chrome or an in-app browser).";
    mic.disabled = true;
  } else {
    rec = new SR();   // une seule instance (en recréer une peut déclencher un son système sur iOS)
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;   // les mots s'affichent dès qu'ils sont entendus
    rec.maxAlternatives = 1;

    rec.onstart = () => { running = true; sessionStart = Date.now(); if (listening && !answering && !answer) say('Listening…'); };

    rec.onresult = (e) => {
      if (dropNext) return;
      // reconstruit depuis e.results à chaque fois : pas de doublons
      sessFinal = ''; sessInterim = '';
      for (let i = 0; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) sessFinal = join(sessFinal, t);
        else sessInterim = join(sessInterim, t);
      }
      retryDelay = 250;
      render();
      if (v2) { clearTimeout(autoTimer); autoTimer = setTimeout(() => { if (listening) endSegment(); }, AUTO_MS); }
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => { if (listening && running) { try { rec.abort(); } catch {} } }, STALL_MS);
    };

    rec.onerror = (e) => {
      if (FATAL.includes(e.error)) {
        stop();
        // sur iPhone, la reconnaissance passe par la Dictée iOS : désactivée = service-not-allowed
        const msg = {
          'service-not-allowed': "Blocked by iOS. Turn on Dictation: Settings › General › Keyboard › Enable Dictation. Also check Settings › Screen Time › Restrictions › Siri & Dictation.",
          'not-allowed': "Microphone denied. In Safari: aA › Website Settings › Microphone › Allow, then reload the page.",
          'audio-capture': "No microphone available (is a call or another app using it?).",
        }[e.error];
        errMsg = msg + ' [' + e.error + ']';
        render();
        say('Error', true);
      } else if (e.error === 'network') {
        say('Network…', true);
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        say('Error: ' + e.error + (e.message ? ' — ' + e.message : ''), true);
      }
    };

    // coupure (silence, iOS…) : on garde tout, même l'interim, puis on relance si besoin
    rec.onend = () => {
      running = false;
      clearTimeout(stallTimer);
      if (dropNext) { dropNext = false; sessFinal = ''; sessInterim = ''; }
      else committed = join(join(committed, sessFinal), sessInterim);
      sessFinal = ''; sessInterim = '';
      render();
      if (!listening) return;
      if (freeRestart) freeRestart = false;
      else if (!v2 && ++restarts > MAX_RESTARTS) { stop(); return; }
      retryDelay = Date.now() - sessionStart < 1000 ? Math.min(retryDelay * 2, 4000) : 250;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(launch, retryDelay);
    };
  }

  function clearText() {
    committed = ''; sessFinal = ''; sessInterim = ''; curPx = 999;
    try { ctrl?.abort(); } catch {}
    ctrl = null; answer = ''; answering = false;
    // la session en cours renverrait tout son texte : on la jette
    if (running) {
      dropNext = true;
      if (listening) freeRestart = true;
      try { rec.abort(); } catch {}
    }
    render();
  }

  function start() {
    if (!rec || listening) return;
    listening = true; restarts = 0; errMsg = '';
    status.classList.remove('err');
    mic.classList.add('on');
    say('Starting…');
    lockScreen();
    clearText();          // un appui = un nouveau vocal
    launch();             // si l'ancienne session finit encore, onend relancera
    // Safari muet (ni onstart ni erreur) : on le dit au lieu de rester bloqué
    setTimeout(() => {
      if (listening && !running && !errMsg) {
        errMsg = "Safari did not start listening. Turn on Dictation (Settings › General › Keyboard), then reload the page. [no-start]";
        stop(); render(); say('Error', true);
      }
    }, 4000);
    clearTimeout(clipTimer);
    if (!v2) clipTimer = setTimeout(stop, MAX_CLIP_MS);
  }
  function stop() {
    listening = false;
    clearTimeout(restartTimer); clearTimeout(stallTimer); clearTimeout(clipTimer); clearTimeout(autoTimer);
    mic.classList.remove('on');
    unlockScreen();
    if (!status.classList.contains('err')) say('');
    try { rec?.stop(); } catch {}
    fit(true);
  }

  // envoie la question entendue à l'IA et affiche la réponse au fil de l'eau
  async function ask(q) {
    if (!q) { say('No question', true); return; }
    try { ctrl?.abort(); } catch {}
    const my = ctrl = new AbortController(), myConv = conv;
    history.push({ role: 'user', content: q });
    let got = '', ok = false;
    errMsg = ''; answer = ''; answering = true; curPx = 999;
    say('Answering…'); render();
    try {
      const r = await fetch(RELAIS, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }), signal: my.signal,
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erreur || 'HTTP ' + r.status); }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const l of lines) {
          if (!l.startsWith('data: ')) continue;
          const d = l.slice(6).trim();
          if (d === '[DONE]') continue;
          try { got += JSON.parse(d).response || ''; } catch {}
        }
        // « OK » = simple contexte : on ne l'affiche pas pendant le streaming
        answer = /^\s*O?K?\.?\s*$/i.test(got) ? '' : got;
        render();
      }
      ok = true;
    } catch (e) {
      if (e.name !== 'AbortError') {
        if (!got) answer = '⚠ ' + (e.message || 'Network unavailable');
        say('Error', true);
      }
    } finally {
      if (conv === myConv) {
        // garde l'échange cohérent : réponse (même partielle) enregistrée, sinon on retire la question
        if (got.trim()) history.push({ role: 'assistant', content: got.trim() });
        else history.pop();
      }
      if (ctrl === my) {
        ctrl = null; answering = false;
        if (ok) {
          const isCtx = /^\s*OK\.?\s*$/i.test(got);
          if (isCtx) answer = '✓ Context saved. Tap the mic for the question.';
          const n = history.filter((m) => m.role === 'assistant' && !/^OK\.?$/i.test(m.content)).length;
          say(isCtx ? 'Context' : 'Q' + n);
        }
        render();
      }
    }
  }

  // en V2, couper le micro traite d'abord ce qui vient d'être entendu
  mic.onclick = () => {
    if (!listening) return start();
    const q = v2 ? heard() : '';
    stop();
    if (q && !isEcho(q)) ask(q);
  };
  // Clear = nouveau contexte : on oublie tout l'échange
  $('clear').onclick = () => { conv++; history = []; clearText(); say(v2 ? 'New context' : ''); };

  const askBtn = $('ask');
  function setV2(on) {
    v2 = on;
    askBtn.classList.toggle('on', on);
    askBtn.setAttribute('aria-pressed', on);
    askBtn.textContent = on ? 'Repeat' : 'Answer';
    try { localStorage.setItem('oral-v2', on ? '1' : '0'); } catch {}
  }
  askBtn.onclick = () => {
    setV2(!v2);
    if (v2 && !listening && heard()) { ask(heard()); return; }   // question déjà là : on répond
    if (!v2) { try { ctrl?.abort(); } catch {} ctrl = null; answer = ''; answering = false; }
    render();
  };
  setV2(v2);
  render();
</script>
</body>
</html>
