<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<title>Live Transcribe</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1a1a1a; --muted: #8a8a85; --card: #ffffff;
    --accent: #e5484d; --border: #e4e4e0; --answer: #2f5bd3; --answer-txt: #1f3f9e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111112; --fg: #ededed; --muted: #77777a; --card: #1b1b1d; --border: #2a2a2d; --answer: #3d63d8; --answer-txt: #a9c0ff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
  }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    height: 100dvh; -webkit-user-select: none; user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  main { height: 100%; display: flex; flex-direction: column; gap: 12px; }
  #transcript {
    flex: 1; min-height: 0; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 20px; line-height: 1.2; font-weight: 600;
    white-space: pre-wrap; overflow-wrap: normal;
    display: flex; align-items: center;
  }
  #text { width: 100%; }
  #text.tiny { overflow-wrap: anywhere; }
  #text:empty::before { content: attr(data-ph); color: var(--muted); font-weight: 500; }
  .interim { color: var(--muted); }
  .side { display: flex; align-items: center; justify-content: center; gap: 16px; }
  #mic {
    width: 88px; height: 88px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: var(--fg); color: var(--bg); display: grid; place-items: center;
    transition: transform .15s, background .2s; touch-action: manipulation;
  }
  #mic:active { transform: scale(.95); }
  #mic:disabled { opacity: .35; }
  #mic.on { background: var(--accent); color: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)} 70%{box-shadow:0 0 0 16px rgba(229,72,77,0)} 100%{box-shadow:0 0 0 0 rgba(229,72,77,0)} }
  #clear {
    background: transparent; color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 14px; font: inherit; font-size: .85rem;
    min-height: 44px; touch-action: manipulation;
  }
  #ask {
    background: transparent; color: var(--answer-txt); border: 2px solid var(--answer);
    border-radius: 999px; padding: 10px 14px; font: inherit; font-size: .9rem; font-weight: 600;
    min-height: 48px; touch-action: manipulation;
  }
  #ask:active { transform: scale(.96); }
  #ask.on { background: var(--answer); color: #fff; }
  #text.answer { color: var(--answer-txt); }
  #status { color: var(--muted); font-size: .8rem; text-align: center; min-height: 1.2em; }
  #status.err { color: var(--accent); }

  /* iPhone à l'horizontale : texte à gauche, commandes en colonne à droite */
  @media (orientation: landscape) {
    main { flex-direction: row; }
    .side { flex-direction: column; width: 104px; flex: none; gap: 12px; }
    #mic { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<main>
  <div id="transcript"><div id="text"></div></div>
  <div class="side">
    <button id="mic" aria-label="Start / stop listening">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="clear">Clear</button>
    <button id="ask" aria-label="Change mode">Answer</button>
    <div id="status"></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const box = $('transcript'), text = $('text'), status = $('status'), mic = $('mic');
  const MIN_PX = 18;
  const committed = '', sessFinal = '', sessInterim = '';   // (ancien mode Live, plus utilisé par render)
  let listening = false;
  let wakeLock = null, curPx = 999, errMsg = '';
  const RELAIS = 'https://oral-reponse.dictees-d9709349.workers.dev';
  let answer = '', answering = false, ctrl = null;   // réponse IA affichée à la place de la question
  // V2 : on n'affiche jamais la question, seulement la réponse (déclenchée après un silence)
  const AUTO_MS = 1800;
  let v2 = false, autoTimer = null;   // v2 = mains libres (Answer ou Repeat)
  // Repeat : on affiche la phrase à répéter, on ignore ma répétition, la phrase suivante la remplace
  let rep = false, target = '', liveNew = '';
  // mémoire de l'échange : contexte, questions, réponses (remise à zéro par Clear)
  let history = [], conv = 0, pending = null, lastAsk = null;
  const MERGE_MS = 8000;   // suite d'une question coupée par une pause : fusion si elle arrive vite
  let mode = 'answer';
  try { mode = localStorage.getItem('oral-mode') || 'answer'; } catch {}


  // V2 mains libres : le micro reste ouvert, on ignore ce qui ressemble à la réponse affichée (moi qui la lis)
  const QWORDS = new Set(['why', 'what', 'how', 'who', 'when', 'where', 'which', 'whose', 'explain', 'example', 'really']);
  const QSTART = new Set([...QWORDS, 'can', 'could', 'would', 'will', 'do', 'does', 'did', 'is', 'are', 'have', 'tell', 'give', 'describe']);
  // vraie tournure de question : « where did… », « what about… », « is it… », « can you… »
  const AUX = new Set(['do', 'does', 'did', 'is', 'are', 'was', 'were', 'can', 'could', 'would', 'will', 'should', 'have', 'has',
                       'about', 'not', 'come', 'much', 'many', 'long', 'often', 'far', 'old', 'kind', 'type', 'else', 'exactly']);
  const PRON = new Set(['you', 'it', 'they', 'we', 'i', 'there', 'he', 'she', 'that', 'this', 'your', 'these', 'those', 'anyone', 'one']);
  const WH = new Set(['why', 'what', 'how', 'who', 'when', 'where', 'which', 'whose']);
  const asksLikeQuestion = (h) => (WH.has(h[0]) && AUX.has(h[1])) || (QSTART.has(h[0]) && !WH.has(h[0]) && PRON.has(h[1]))
    || ['tell', 'give', 'describe', 'explain'].includes(h[0]);
  const words = (s) => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
  function isEcho(q) {
    const refs = history.filter((m) => m.role === 'assistant' && !/^OK\.?$/i.test(m.content)).slice(-2).map((m) => m.content);
    if (answering) refs.push(answer);
    const a = words(refs.join(' '));
    const h = words(q);
    if (h.length < 3) return !h.some((w) => QWORDS.has(w));   // « so yeah », « um okay » : bruit
    if (!a.length) return false;
    const uni = new Set(a), bi = new Set(a.slice(1).map((w, i) => a[i] + ' ' + w));
    const uHit = h.filter((w) => uni.has(w)).length / h.length;
    const hb = h.slice(1).map((w, i) => h[i] + ' ' + w);
    const bHit = hb.filter((b) => bi.has(b)).length / hb.length;
    const tri = new Set(a.slice(2).map((w, i) => a[i] + ' ' + a[i + 1] + ' ' + w));
    const tHit = h.slice(2).filter((w, i) => tri.has(h[i] + ' ' + h[i + 1] + ' ' + w)).length / (h.length - 2);
    // courte question bien tournée (« can you give an example », « is it better than an MLP ») : jamais un écho, sauf lecture mot pour mot
    if (h.length <= 12 && asksLikeQuestion(h) && tHit <= 0.8) return false;
    return bHit >= 0.4 || uHit >= 0.8;
  }
  function isRepeat(q) {
    const a = words(target), h = words(q);
    if (!a.length) return false;
    if (!h.length) return true;
    const uni = new Set(a), bi = new Set(a.slice(1).map((w, i) => a[i] + ' ' + w));
    const uHit = h.filter((w) => uni.has(w)).length / h.length;
    if (h.length < 3) return uHit >= 0.5;
    const hb = h.slice(1).map((w, i) => h[i] + ' ' + w);
    const bHit = hb.filter((b) => bi.has(b)).length / hb.length;
    return bHit >= 0.4 || uHit >= 0.7;
  }

  function join(a, b) {
    b = b.trim();
    if (!b) return a;
    return a ? a + ' ' + b : b;
  }

  // plus grande taille où toute la phrase tient ; pendant un vocal on ne fait que rétrécir (pas de saut)
  function fit(grow = !listening && !answering) {
    const cs = getComputedStyle(box);
    const maxH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const maxW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const cap = Math.max(MIN_PX, Math.floor(maxH / 1.2));
    text.classList.remove('tiny');
    let lo = MIN_PX, hi = Math.min(grow ? cap : curPx, cap) + 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      text.style.fontSize = mid + 'px';
      if (text.scrollHeight <= maxH && text.scrollWidth <= maxW) lo = mid; else hi = mid;
    }
    text.style.fontSize = (curPx = lo) + 'px';
    text.classList.toggle('tiny', text.scrollWidth > maxW);   // mot trop long : on le coupe
  }

  function render() {
    if (errMsg) { text.textContent = errMsg; fit(true); return; }   // erreur affichée en grand
    if (rep) {
      text.classList.remove('answer');
      text.textContent = liveNew || target;
      text.dataset.ph = listening ? 'Listening…' : 'Repeat mode: tap the mic — it shows each sentence to repeat.';
      fit(); return;
    }
    const showAnswer = answering || answer;
    text.classList.toggle('answer', !!showAnswer);
    if (showAnswer) { text.textContent = answer.trim() || '…'; fit(); return; }
    if (v2) {
      text.textContent = '';
      text.dataset.ph = listening ? 'Listening…'
        : history.length ? 'Tap the mic to keep listening.'
        : 'Answer mode: tap the mic — it listens to the context, then to the questions.';
      fit(true); return;
    }
    text.dataset.ph = 'Tap the mic and speak…';
    text.textContent = join(committed, sessFinal);
    if (sessInterim.trim()) {
      const span = document.createElement('span');
      span.className = 'interim';
      span.textContent = (text.textContent ? ' ' : '') + sessInterim.trim();
      text.appendChild(span);
    }
    fit();
  }
  new ResizeObserver(() => fit(true)).observe(box);   // rotation, barre Safari

  function say(msg, err = false) { status.textContent = msg; status.classList.toggle('err', err); }

  // écran allumé pendant l'écoute
  async function lockScreen() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      const l = await navigator.wakeLock.request('screen');
      if (listening && !wakeLock) wakeLock = l; else l.release();
    } catch {}
  }
  function unlockScreen() { try { wakeLock?.release(); } catch {} wakeLock = null; }
  // iOS exige un geste pour reprendre le verrou : on retente au prochain toucher
  document.addEventListener('touchend', () => { if (listening && !wakeLock) lockScreen(); });

  // pas de zoom (pincer, double-tap)
  ['gesturestart', 'gesturechange', 'dblclick'].forEach((t) =>
    document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));

  // --- micro sans la Dictée iOS (elle joue un son, même en silencieux) : enregistrement direct + détection de parole + Whisper ---
  const STT = RELAIS + '/stt';
  const PRE_MS = 400;          // garde le début du mot qui a déclenché la détection
  const START_MS = 120;        // parole continue minimum pour ouvrir un segment
  const MAX_SEG_MS = 30000;    // segment trop long : on le coupe
  const INTERIM_MS = 1000;     // Repeat : retranscription du segment en cours toutes les secondes
  const endMs = () => (rep ? 1200 : AUTO_MS);   // silence qui clôt une phrase
  let ac = null, stream = null, src = null, proc = null;
  let noise = 0.004, inSpeech = false, loudMs = 0, quietMs = 0, segMs = 0;
  let pre = [], seg = [], segId = 0, interimBusy = false, lastInterim = 0;
  let queue = Promise.resolve();   // les phrases sont traitées dans l'ordre

  async function startCapture() {
    // iOS n'autorise l'audio que pendant le toucher : on le crée AVANT d'attendre la permission du micro
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const resumed = ac.resume().catch(() => {});
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    await resumed;
    src = ac.createMediaStreamSource(stream);
    proc = ac.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = (e) => onAudio(e.inputBuffer.getChannelData(0));
    src.connect(proc);
    proc.connect(ac.destination);   // nécessaire pour que Safari fasse tourner le nœud ; sa sortie reste muette
    inSpeech = false; loudMs = 0; pre = []; seg = [];
  }

  function stopCapture(flush) {
    if (flush && inSpeech) finishSegment();
    inSpeech = false; seg = []; pre = [];
    try { proc && (proc.onaudioprocess = null, proc.disconnect()); } catch {}
    try { src?.disconnect(); } catch {}
    try { stream?.getTracks().forEach((t) => t.stop()); } catch {}
    try { ac?.close(); } catch {}
    ac = stream = src = proc = null;
  }

  // détection de parole : volume au-dessus du bruit de fond qui s'adapte à la pièce
  function onAudio(buf) {
    const x = new Float32Array(buf);
    let sum = 0;
    for (let i = 0; i < x.length; i++) sum += x[i] * x[i];
    const rms = Math.sqrt(sum / x.length), ms = (x.length / ac.sampleRate) * 1000;
    const thr = Math.max(0.01, noise * 3);
    if (!inSpeech) {
      if (rms < thr) noise = noise * 0.95 + rms * 0.05;
      pre.push(x);
      while (pre.length * ms > PRE_MS) pre.shift();
      loudMs = rms > thr ? loudMs + ms : 0;
      if (loudMs >= START_MS) { inSpeech = true; seg = pre; pre = []; quietMs = 0; segMs = 0; segId++; lastInterim = Date.now(); }
      return;
    }
    seg.push(x);
    segMs += ms;
    quietMs = rms > thr * 0.7 ? 0 : quietMs + ms;
    if (quietMs >= endMs() || segMs >= MAX_SEG_MS) finishSegment();
    else if (rep && !interimBusy && Date.now() - lastInterim >= INTERIM_MS) interim();
  }

  function finishSegment() {
    const audio = seg, rate = ac.sampleRate;
    inSpeech = false; seg = []; loudMs = 0; segId++;   // un interim en vol pour ce segment sera ignoré
    queue = queue.then(() => transcribe(audio, rate)).then((t) => onHeard(t), () => say('Network…', true));
  }

  function interim() {
    const id = segId, rate = ac.sampleRate;
    interimBusy = true; lastInterim = Date.now();
    transcribe(seg.slice(), rate).then((t) => { if (id === segId && inSpeech) showLive(t); }, () => {})
      .finally(() => { interimBusy = false; });
  }

  // Float32 → WAV 16 kHz mono (ce que Whisper attend)
  function toWav(chunks, rate) {
    const n = chunks.reduce((s, c) => s + c.length, 0), all = new Float32Array(n);
    let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    const ratio = rate / 16000, len = Math.floor(n / ratio), pcm = new Int16Array(len);
    for (let i = 0; i < len; i++) {
      const v = Math.max(-1, Math.min(1, all[Math.floor(i * ratio)]));
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    const b = new DataView(new ArrayBuffer(44));
    const str = (off, s) => [...s].forEach((ch, i) => b.setUint8(off + i, ch.charCodeAt(0)));
    str(0, 'RIFF'); b.setUint32(4, 36 + pcm.byteLength, true); str(8, 'WAVE'); str(12, 'fmt ');
    b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
    b.setUint32(24, 16000, true); b.setUint32(28, 32000, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
    str(36, 'data'); b.setUint32(40, pcm.byteLength, true);
    return new Blob([b, pcm], { type: 'audio/wav' });
  }

  // phrases que Whisper invente sur du bruit
  const GHOST = /^(thank you( for watching)?|thanks( for watching)?|you|bye|okay|so|uh|um|\.|…|\s)*[.!?]*$/i;
  async function transcribe(chunks, rate) {
    const r = await fetch(STT, { method: 'POST', headers: { 'content-type': 'audio/wav' }, body: toWav(chunks, rate) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erreur || 'HTTP ' + r.status); }
    const t = ((await r.json()).text || '').trim();
    return GHOST.test(t) ? '' : t.charAt(0).toUpperCase() + t.slice(1);
  }

  // Repeat : la nouvelle phrase s'affiche en direct dès 3 mots, sauf si c'est moi qui répète
  function showLive(t) {
    if (!rep || !t) return;
    const isNew = words(t).length >= 3 && !isRepeat(t);
    if (!liveNew && isNew) { curPx = 999; say('New'); }
    if (liveNew || isNew) { liveNew = t; render(); }
  }

  // une phrase complète vient d'être transcrite : nouvelle phrase / question, ou ma propre voix ?
  function onHeard(q) {
    if (!q) return;
    if (rep) {
      liveNew = '';
      if (isRepeat(q)) say('You ✓');
      else { target = q; say('New'); }
      render(); return;
    }
    if (isEcho(q)) { if (lastAsk) lastAsk.echoed = true; say('You ✓'); return; }
    ask(q);
  }

  // retour après verrouillage / arrière-plan : iOS a pu couper le micro, on le reprend
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !listening) return;
    wakeLock = null; lockScreen();
    const dead = !stream || stream.getAudioTracks().some((t) => t.readyState === 'ended');
    if (dead) { stopCapture(false); try { await startCapture(); } catch {} }
    else { try { await ac.resume(); } catch {} }
  });
  // Safari peut suspendre l'audio : un toucher le relance
  document.addEventListener('touchend', () => { if (listening && ac?.state !== 'running') ac?.resume().catch(() => {}); });

  function clearText() {
    curPx = 999;
    try { ctrl?.abort(); } catch {}
    ctrl = null; answer = ''; answering = false; target = ''; liveNew = '';
    segId++;   // les transcriptions en cours sont ignorées
    render();
  }

  async function start() {
    if (listening) return;
    listening = true; errMsg = '';
    status.classList.remove('err');
    mic.classList.add('on');
    say('Starting…');
    lockScreen();
    clearText();
    try {
      await startCapture();
      if (listening) say('Listening…'); else stopCapture(false);
    } catch (e) {
      listening = false; mic.classList.remove('on'); unlockScreen(); stopCapture(false);
      errMsg = e.name === 'NotAllowedError'
        ? 'Microphone denied. In Safari: aA › Website Settings › Microphone › Allow, then reload the page.'
        : 'Microphone unavailable (' + (e.message || e.name) + ').';
      render(); say('Error', true);
    }
  }
  function stop() {
    listening = false;
    mic.classList.remove('on');
    unlockScreen();
    stopCapture(true);   // la phrase en cours est quand même traitée
    if (!status.classList.contains('err') && !answering) say('');
    fit(true);
  }

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    errMsg = 'The microphone requires HTTPS and Safari.';
    mic.disabled = true;
  }

  // envoie la question entendue à l'IA et affiche la réponse au fil de l'eau
  async function ask(q) {
    if (!q) { say('No question', true); return; }
    // réponse précédente encore en cours = question coupée par une pause : on fusionne
    const looksNew = QSTART.has(words(q)[0]);   // « where did you… » = vraie nouvelle question
    if (answering && pending && pending.conv === conv && !looksNew) {
      const k = history.indexOf(pending.u);
      if (k >= 0) { q = join(pending.u.content, q); history.splice(k, 1); }
    } else if (lastAsk && lastAsk.conv === conv && !lastAsk.echoed && Date.now() - lastAsk.t < MERGE_MS
               && !looksNew) {
      // réponse déjà finie mais pas encore lue, et la phrase ne commence pas comme une question : c'est la suite
      const k = history.indexOf(lastAsk.u);
      if (k >= 0 && !/^OK\.?$/i.test(history[k + 1]?.content ?? '')) {   // jamais dans un contexte : la question doit être répondue
        q = join(lastAsk.u.content, q);
        history.splice(k, history[k + 1]?.role === 'assistant' ? 2 : 1);
      }
    }
    try { ctrl?.abort(); } catch {}
    const my = ctrl = new AbortController(), myConv = conv;
    const u = { role: 'user', content: q };
    history.push(u);
    pending = { u, conv };
    lastAsk = { u, conv, t: Date.now(), echoed: false };
    let got = '', ok = false;
    errMsg = ''; answer = ''; answering = true; curPx = 999;
    say('Answering…'); render();
    const eat = (l) => {
      if (!l.startsWith('data: ')) return;
      const d = l.slice(6).trim();
      if (d === '[DONE]') return;
      try { const j = JSON.parse(d); got += j.response ?? j.choices?.[0]?.delta?.content ?? ''; } catch {}
    };
    try {
      const r = await fetch(RELAIS, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }), signal: my.signal,
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erreur || 'HTTP ' + r.status); }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) { buf += dec.decode(); break; }
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        lines.forEach(eat);
        // « OK » = simple contexte : on ne l'affiche pas pendant le streaming
        answer = /^\s*O?K?\.?\s*$/i.test(got) ? '' : got;
        render();
      }
      eat(buf.trim());
      answer = /^\s*O?K?\.?\s*$/i.test(got) ? '' : got;
      ok = true;
    } catch (e) {
      if (e.name !== 'AbortError') {
        if (!got) answer = '⚠ ' + (e.message || 'Network unavailable');
        say('Error', true);
      }
    } finally {
      // chaque réponse reste collée à SA question ; question abandonnée ou sans réponse : retirée
      const k = history.indexOf(u);
      if (conv === myConv && k >= 0) {
        if (got.trim()) history.splice(k + 1, 0, { role: 'assistant', content: got.trim() });   // même partielle
        else history.splice(k, 1);
      }
      if (pending?.u === u) pending = null;
      if (ctrl === my) {
        ctrl = null; answering = false;
        if (ok) {
          const isCtx = /^\s*OK\.?\s*$/i.test(got);
          if (isCtx) answer = '✓ Context saved. Waiting for the question…';
          const n = history.filter((m) => m.role === 'assistant' && !/^OK\.?$/i.test(m.content)).length;
          say(isCtx ? 'Context' : 'Q' + n);
        }
        render();
      }
    }
  }

  // couper le micro traite quand même la phrase en cours
  mic.onclick = () => (listening ? stop() : start());

  // Clear = nouveau contexte : on oublie tout l'échange
  $('clear').onclick = () => { conv++; history = []; pending = null; lastAsk = null; clearText(); say(v2 && !rep ? 'New context' : ''); };

  const askBtn = $('ask');
  // un seul bouton qui bascule entre les deux modes : Answer ↔ Repeat
  const MODES = { answer: 'Answer', repeat: 'Repeat' };
  function setMode(m) {
    mode = MODES[m] ? m : 'answer';
    v2 = mode !== 'live'; rep = mode === 'repeat';
    askBtn.classList.toggle('on', v2);
    askBtn.textContent = MODES[mode];
    try { localStorage.setItem('oral-mode', mode); } catch {}
  }
  askBtn.onclick = () => {
    setMode(mode === 'answer' ? 'repeat' : 'answer');
    // on repart d'un écran vide dans le nouveau mode (l'échange Answer reste en mémoire jusqu'à Clear)
    clearText();
    if (!status.classList.contains('err')) say(listening ? 'Listening…' : '');
  };
  setMode(mode);
  render();
</script>
</body>
</html>
