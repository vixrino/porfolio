<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<title>Live Transcribe</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1a1a1a; --muted: #8a8a85; --card: #ffffff;
    --accent: #e5484d; --border: #e4e4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111112; --fg: #ededed; --muted: #77777a; --card: #1b1b1d; --border: #2a2a2d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    height: 100dvh; -webkit-user-select: none; user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  main { height: 100%; display: flex; flex-direction: column; gap: 12px; }
  #transcript {
    flex: 1; min-height: 0; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 20px; line-height: 1.2; font-weight: 600;
    white-space: pre-wrap; overflow-wrap: break-word;
    display: flex; align-items: center;
  }
  #text { width: 100%; }
  #text:empty::before { content: "Appuie sur le micro et parle en anglais…"; color: var(--muted); font-weight: 500; }
  .interim { color: var(--muted); }
  .side { display: flex; align-items: center; justify-content: center; gap: 16px; }
  #mic {
    width: 88px; height: 88px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: var(--fg); color: var(--bg); display: grid; place-items: center;
    transition: transform .15s, background .2s; touch-action: manipulation;
  }
  #mic:active { transform: scale(.95); }
  #mic:disabled { opacity: .35; }
  #mic.on { background: var(--accent); color: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)} 70%{box-shadow:0 0 0 16px rgba(229,72,77,0)} 100%{box-shadow:0 0 0 0 rgba(229,72,77,0)} }
  #clear {
    background: transparent; color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 14px; font: inherit; font-size: .85rem;
    min-height: 44px; touch-action: manipulation;
  }
  #status { color: var(--muted); font-size: .8rem; text-align: center; min-height: 1.2em; }
  #status.err { color: var(--accent); }

  /* iPhone à l'horizontale : texte à gauche, commandes en colonne à droite */
  @media (orientation: landscape) {
    main { flex-direction: row; }
    .side { flex-direction: column; width: 104px; flex: none; gap: 12px; }
    #mic { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<main>
  <div id="transcript" aria-live="polite"><div id="text"></div></div>
  <div class="side">
    <button id="mic" aria-label="Démarrer / arrêter l'écoute">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="clear">Effacer</button>
    <div id="status"></div>
  </div>
</main>
<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = (id) => document.getElementById(id);
  const box = $('transcript'), text = $('text'), status = $('status'), mic = $('mic');

  const FATAL = ['not-allowed', 'service-not-allowed', 'audio-capture'];
  const MIN_PX = 18, MAX_PX = 160;

  let committed = '';   // texte des sessions précédentes (après une coupure iOS)
  let sessFinal = '', sessInterim = '';
  let listening = false, rec = null;
  let retryDelay = 250, sessionStart = 0, restartTimer = null;
  let wakeLock = null;

  function join(a, b) {
    b = b.trim();
    if (!b) return a;
    return a ? a + ' ' + b : b;
  }

  // plus grande taille de police où toute la phrase tient dans le cadre
  function fit() {
    const maxH = box.clientHeight - 32, maxW = box.clientWidth - 40;
    let lo = MIN_PX, hi = MAX_PX;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      text.style.fontSize = mid + 'px';
      if (text.scrollHeight <= maxH && text.scrollWidth <= maxW) lo = mid; else hi = mid;
    }
    text.style.fontSize = lo + 'px';
  }

  function render() {
    text.textContent = join(committed, sessFinal);
    if (sessInterim.trim()) {
      const span = document.createElement('span');
      span.className = 'interim';
      span.textContent = (text.textContent ? ' ' : '') + sessInterim.trim();
      text.appendChild(span);
    }
    fit();
  }
  addEventListener('resize', () => requestAnimationFrame(fit));

  function say(msg, err = false) { status.textContent = msg; status.classList.toggle('err', err); }

  // écran allumé pendant l'écoute
  async function lockScreen() {
    try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  function unlockScreen() { try { wakeLock?.release(); } catch {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && listening) { wakeLock = null; lockScreen(); }
  });

  if (!window.isSecureContext) {
    say("Le micro exige HTTPS.", true);
    mic.disabled = true;
  } else if (!SR) {
    say("Ouvre cette page dans Safari.", true);
    mic.disabled = true;
  } else {
    rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;   // les mots s'affichent dès qu'ils sont entendus
    rec.maxAlternatives = 1;

    rec.onstart = () => { sessionStart = Date.now(); say('Écoute…'); };

    rec.onresult = (e) => {
      // reconstruit depuis e.results à chaque fois : pas de doublons
      sessFinal = ''; sessInterim = '';
      for (let i = 0; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) sessFinal = join(sessFinal, t);
        else sessInterim = join(sessInterim, t);
      }
      retryDelay = 250;
      render();
    };

    rec.onerror = (e) => {
      if (FATAL.includes(e.error)) {
        say(e.error === 'audio-capture' ? 'Aucun micro.' : 'Micro refusé : Réglages › Safari › Micro.', true);
        stop();
      } else if (e.error === 'network') {
        say('Réseau…', true);
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        say('Erreur : ' + e.error, true);
      }
    };

    // coupure (silence, iOS…) : on garde tout, même l'interim, puis on relance
    rec.onend = () => {
      committed = join(join(committed, sessFinal), sessInterim);
      sessFinal = ''; sessInterim = '';
      render();
      if (!listening) return;
      retryDelay = Date.now() - sessionStart < 1000 ? Math.min(retryDelay * 2, 4000) : 250;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => { if (listening) { try { rec.start(); } catch {} } }, retryDelay);
    };
  }

  function clearText() { committed = ''; sessFinal = ''; sessInterim = ''; render(); }

  function start() {
    if (!rec || listening) return;
    clearText();          // un appui = un nouveau vocal
    listening = true;
    mic.classList.add('on');
    say('Démarrage…');
    lockScreen();
    try { rec.start(); } catch {}
  }
  function stop() {
    listening = false;
    clearTimeout(restartTimer);
    mic.classList.remove('on');
    unlockScreen();
    if (!status.classList.contains('err')) say('');
    try { rec?.stop(); } catch {}
  }

  mic.onclick = () => (listening ? stop() : start());
  $('clear').onclick = clearText;
  render();
</script>
</body>
</html>
