# « Ajouter un texte » sur la page des dictées : le Worker Cloudflare (dictee-d9709349be/relais)
# envoie un repository_dispatch avec le texte ; ici on génère l'audio et on met en ligne.
name: Ajouter une dictée
on:
  repository_dispatch:
    types: [ajouter-dictee]
permissions:
  contents: write
  pages: write
# pas de « concurrency » : GitHub y annulerait les ajouts en attente ; deux ajouts
# simultanés sont gérés par ajouter.py (push refusé → on repart de main et on recommence)
jobs:
  ajouter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts==7.2.8 lameenc==1.8.4   # versions figées : même audio qu'en local
      - name: Texte → audio → commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python dictee-d9709349be/ajouter.py
      - name: Republier le site
        # un push fait avec le token d'Actions ne relance pas toujours GitHub Pages
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env: { GH_TOKEN: '${{ github.token }}' }
