<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dictées</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --txt: #1d1c1a; --mute: #77736b;
    --line: #e3dfd6; --accent: #2f5bd3; --accent-txt: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --txt: #ecebe7; --mute: #9a968d;
      --line: #33322f; --accent: #7d9cff; --accent-txt: #0d0d0c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  select, button { font: inherit; color: inherit; }
  select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card);
  }
  .player {
    margin-top: 16px; padding: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .play {
    width: 56px; height: 56px; flex: none; border: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-txt); cursor: pointer;
    display: grid; place-items: center;
  }
  .play svg { width: 24px; height: 24px; fill: currentColor; }
  .ghost {
    border: 1px solid var(--line); background: transparent; border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--mute); }
  .ghost[aria-pressed="true"] {
    background: var(--txt); color: var(--bg); border-color: var(--txt);
  }
  input[type=range] { display: block; width: 100%; margin: 16px 0 0; accent-color: var(--accent); }
  .ghost { min-height: 40px; }
  .time { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 14px; }
  .speeds { margin-top: 16px; flex-wrap: wrap; }
  .speeds span { color: var(--mute); font-size: 14px; }
  .reveal { margin-top: 24px; }
  .texte {
    margin-top: 12px; padding: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; font-size: 18px; line-height: 1.7;
  }
  .hint { margin-top: 24px; color: var(--mute); font-size: 13px; }
  kbd {
    font: 12px ui-monospace, monospace; padding: 1px 5px;
    border: 1px solid var(--line); border-radius: 4px;
  }
</style>
</head>
<body>
<main>
  <h1>Dictées</h1>

  <select id="choix" aria-label="Choisir une dictée"></select>

  <div class="player">
    <div class="row">
      <button class="play" id="play" aria-label="Lecture"></button>
      <button class="ghost" id="recul" title="Reculer de 5 s">−5 s</button>
      <span class="time" id="temps">0:00 / 0:00</span>
    </div>
    <input type="range" id="barre" min="0" max="0" step="0.1" value="0" aria-label="Position">
    <div class="row speeds" id="vitesses">
      <span>Vitesse</span>
      <button class="ghost" data-v="1" aria-pressed="true">×1</button>
      <button class="ghost" data-v="1.25" aria-pressed="false">×1,25</button>
      <button class="ghost" data-v="1.5" aria-pressed="false">×1,5</button>
    </div>
  </div>

  <button class="ghost reveal" id="voir" aria-expanded="false">Afficher le texte (correction)</button>
  <div class="texte" id="texte" hidden></div>

  <p class="hint"><kbd>Espace</kbd> lecture / pause · <kbd>←</kbd> −5 s</p>
</main>

<audio id="audio" preload="auto"></audio>
<script src="textes.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const audio = $('audio'), play = $('play'), barre = $('barre');
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  let vitesse = 1;
  const ms = 'mediaSession' in navigator;

  const fmt = s => (s = Math.floor(s || 0), `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);

  function charger(i) {
    const d = DICTEES[i];
    audio.src = d.audio;
    audio.playbackRate = vitesse;          // src réinitialise la vitesse
    $('texte').textContent = d.texte;
    $('texte').hidden = true;
    $('voir').setAttribute('aria-expanded', 'false');
    $('voir').textContent = 'Afficher le texte (correction)';
    if (ms) navigator.mediaSession.metadata = new MediaMetadata({ title: d.titre, artist: 'Dictée' });
  }

  DICTEES.forEach((d, i) => $('choix').add(new Option(d.titre, i)));
  $('choix').onchange = e => charger(e.target.value);
  if (DICTEES.length) charger(0);

  play.innerHTML = ICON_PLAY;
  play.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => { play.innerHTML = ICON_PAUSE; play.setAttribute('aria-label', 'Pause'); };
  audio.onpause = () => { play.innerHTML = ICON_PLAY; play.setAttribute('aria-label', 'Lecture'); };

  $('recul').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 5); };

  const majTemps = () => {
    barre.max = audio.duration || 0;
    barre.value = audio.currentTime;
    $('temps').textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  };
  audio.ontimeupdate = audio.onloadedmetadata = majTemps;
  barre.oninput = () => { audio.currentTime = barre.value; };

  $('vitesses').onclick = e => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    vitesse = audio.playbackRate = +b.dataset.v;   // la hauteur de la voix est préservée
    for (const x of $('vitesses').querySelectorAll('[data-v]')) x.setAttribute('aria-pressed', x === b);
  };

  $('voir').onclick = () => {
    const t = $('texte'), ouvert = t.hidden;
    t.hidden = !ouvert;
    $('voir').setAttribute('aria-expanded', ouvert);
    $('voir').textContent = ouvert ? 'Masquer le texte' : 'Afficher le texte (correction)';
  };

  // contrôles de l'écran verrouillé / des écouteurs ; l'<audio> continue écran éteint
  if (ms) {
    const recule = s => { audio.currentTime = Math.max(0, audio.currentTime - s); };
    const actions = {
      play: () => audio.play(),
      pause: () => audio.pause(),
      seekbackward: e => recule(e.seekOffset || 5),
      seekforward: e => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (e.seekOffset || 5)); },
      seekto: e => { audio.currentTime = e.seekTime; },
    };
    for (const [a, f] of Object.entries(actions)) {
      try { navigator.mediaSession.setActionHandler(a, f); } catch {}
    }
    const etat = () => {
      if (!audio.duration) return;
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime }); } catch {}
    };
    audio.addEventListener('loadedmetadata', etat);
    audio.addEventListener('ratechange', etat);
    audio.addEventListener('seeked', etat);
  }

  // après un clic, le bouton garde le focus et Espace le re-cliquerait
  document.addEventListener('click', e => e.target.closest('button')?.blur());
  document.onkeydown = e => {
    if (e.target.matches('select, input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); play.click(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); $('recul').click(); }
  };
</script>
</body>
</html>
