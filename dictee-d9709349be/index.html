<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dictées</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --txt: #1d1c1a; --mute: #77736b;
    --line: #e3dfd6; --accent: #2f5bd3; --accent-txt: #fff;
    --faint: #b8b4ab; --surligne: #cfe0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --txt: #ecebe7; --mute: #9a968d;
      --line: #33322f; --accent: #7d9cff; --accent-txt: #0d0d0c;
      --faint: #5e5c57; --surligne: #29406e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  button { font: inherit; color: inherit; }
  /* liste maison : le <select> natif ignore les couleurs sur mobile */
  .liste { position: relative; }
  .choix {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); cursor: pointer; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .choix svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--mute); stroke-width: 2; }
  .options {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px);
    margin: 0; padding: 4px; list-style: none; max-height: 60vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgb(0 0 0 / .15);
  }
  .options li { padding: 10px 12px; border-radius: 6px; cursor: pointer; }
  .options li:hover, .options li[aria-selected="true"] { background: var(--bg); }
  .options li[aria-selected="true"] { font-weight: 600; }
  .options li.faite, .choix.faite { color: var(--faint); }
  .fait {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
    font-size: 15px; cursor: pointer; user-select: none;
  }
  .fait input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  .player {
    margin-top: 16px; padding: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .play {
    width: 56px; height: 56px; flex: none; border: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-txt); cursor: pointer;
    display: grid; place-items: center;
  }
  .play svg { width: 24px; height: 24px; fill: currentColor; }
  .ghost {
    border: 1px solid var(--line); background: transparent; border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--mute); }
  .ghost[aria-pressed="true"] {
    background: var(--txt); color: var(--bg); border-color: var(--txt);
  }
  input[type=range] { display: block; width: 100%; margin: 16px 0 0; accent-color: var(--accent); }
  .ghost { min-height: 40px; }
  .icone { display: grid; place-items: center; min-width: 44px; }
  .icone svg {
    width: 20px; height: 20px; fill: none; stroke: currentColor;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .time { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 14px; }
  .speeds { margin-top: 16px; flex-wrap: wrap; }
  .speeds span { color: var(--mute); font-size: 14px; }
  .reveal { margin-top: 24px; }
  .texte {
    margin-top: 12px; padding: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; font-size: 18px; line-height: 1.7;
    white-space: pre-line;
  }
  .ajouter { margin-top: 12px; }
  dialog {
    width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 20px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--txt);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h2 { margin: 0 0 16px; font-size: 20px; }
  dialog form { display: grid; gap: 12px; }
  dialog input[type=text], dialog textarea {
    width: 100%; font: inherit; font-size: 16px; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  dialog textarea { min-height: 38dvh; resize: vertical; }
  .fichier { justify-self: start; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .plein { background: var(--accent); color: var(--accent-txt); border-color: var(--accent); }
  .plein:disabled { opacity: .6; }
  .etat { margin: 0; font-size: 14px; color: var(--mute); }
  .etat.erreur { color: #c0392b; }
  .texte .lu { background: var(--surligne); border-radius: 3px; box-shadow: 0 0 0 2px var(--surligne); }
</style>
</head>
<body>
<main>
  <h1>Dictées</h1>

  <div class="liste">
    <button class="choix" id="choix" aria-haspopup="listbox" aria-expanded="false">
      <span id="choix-titre"></span>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul class="options" id="options" role="listbox" aria-label="Choisir une dictée" hidden></ul>
  </div>
  <label class="fait"><input type="checkbox" id="fait"> Déjà faite</label>
  <button class="ghost ajouter" id="ajouter">+ Ajouter un texte</button>
  <p class="etat" id="suivi" hidden></p>

  <dialog id="fenetre">
    <h2>Ajouter un texte</h2>
    <form id="formulaire">
      <input type="text" id="nv-titre" placeholder="Titre (facultatif)" maxlength="120">
      <button type="button" class="ghost fichier" id="nv-choisir">Choisir un fichier (.txt, .docx)</button>
      <input type="file" id="nv-fichier" accept=".txt,.md,.docx,text/plain" hidden>
      <textarea id="nv-texte" placeholder="… ou colle le texte ici"></textarea>
      <p class="etat" id="nv-etat" hidden></p>
      <div class="actions">
        <button type="button" class="ghost" id="nv-annuler">Annuler</button>
        <button type="submit" class="ghost plein" id="nv-ok">Ajouter</button>
      </div>
    </form>
  </dialog>

  <div class="player">
    <div class="row">
      <button class="play" id="play" aria-label="Lecture"></button>
      <button class="ghost icone" id="debut" title="Revenir au début" aria-label="Revenir au début"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="ghost" id="recul" title="Reculer de 5 s">−5 s</button>
      <span class="time" id="temps">0:00 / 0:00</span>
    </div>
    <input type="range" id="barre" min="0" max="0" step="0.1" value="0" aria-label="Position">
    <div class="row speeds" id="vitesses">
      <span>Vitesse</span>
      <button class="ghost" data-v="0.8" aria-pressed="false">×0,8</button>
      <button class="ghost" data-v="1" aria-pressed="true">×1</button>
    </div>
  </div>

  <button class="ghost reveal" id="voir" aria-expanded="false">Afficher le texte (correction)</button>
  <div class="texte" id="texte" hidden></div>

</main>

<audio id="audio" preload="auto"></audio>
<script src="textes.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const audio = $('audio'), play = $('play'), barre = $('barre');
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  // « ×1 » joue en réalité à 0,9 : toutes les vitesses affichées sont relatives à ça
  const BASE = 0.9;
  let vitesse = BASE;
  const ms = 'mediaSession' in navigator;

  const fmt = s => (s = Math.floor(s || 0), `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);

  // « déjà faite » : mémorisé dans ce navigateur (par appareil)
  let faites = {};
  try { faites = JSON.parse(localStorage.getItem('dictees-faites')) || {}; } catch {}
  const libelle = d => (faites[d.id] ? '✓ ' : '') + d.titre;

  let courant = 0, mots = [], spans = [], actif = -1;

  function majListe() {
    DICTEES.forEach((d, i) => {
      const li = $('options').children[i];
      li.textContent = libelle(d);
      li.classList.toggle('faite', !!faites[d.id]);
      li.setAttribute('aria-selected', i === courant);
    });
    $('choix-titre').textContent = libelle(DICTEES[courant]);
    $('choix').classList.toggle('faite', !!faites[DICTEES[courant].id]);
  }

  // le texte affiché, découpé en <span> aux positions des mots lus (audio/*.json)
  function afficherTexte(d, bornes) {
    const t = $('texte');
    t.textContent = '';
    spans = []; actif = -1; mots = bornes;
    let pos = 0;
    for (const [, deb, fin] of bornes) {
      t.append(d.texte.slice(pos, deb));
      const s = document.createElement('span');
      s.textContent = d.texte.slice(deb, fin);
      t.append(s);
      spans.push(s);
      pos = fin;
    }
    t.append(d.texte.slice(pos));
  }

  function charger(i) {
    courant = +i;
    const d = DICTEES[courant];
    majListe();
    $('fait').checked = !!faites[d.id];
    audio.src = d.audio;
    audio.playbackRate = vitesse;          // src réinitialise la vitesse
    afficherTexte(d, []);
    fetch(d.mots).then(r => r.json()).then(b => { if (DICTEES[courant] === d) afficherTexte(d, b); }).catch(() => {});
    $('texte').hidden = true;
    $('voir').setAttribute('aria-expanded', 'false');
    $('voir').textContent = 'Afficher le texte (correction)';
    if (ms) navigator.mediaSession.metadata = new MediaMetadata({ title: d.titre, artist: 'Dictée' });
  }

  const ouvrir = oui => {
    $('options').hidden = !oui;
    $('choix').setAttribute('aria-expanded', oui);
    if (oui) $('options').children[courant].scrollIntoView({ block: 'nearest' });
  };
  function construireListe() {
    $('options').textContent = '';
    DICTEES.forEach((d, i) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.onclick = () => { ouvrir(false); if (i !== courant) charger(i); };
      $('options').append(li);
    });
  }
  construireListe();
  $('choix').onclick = () => ouvrir($('options').hidden);
  document.addEventListener('click', e => { if (!e.target.closest('.liste')) ouvrir(false); });
  $('fait').onchange = e => {
    const d = DICTEES[courant];
    if (e.target.checked) faites[d.id] = true; else delete faites[d.id];
    try { localStorage.setItem('dictees-faites', JSON.stringify(faites)); } catch {}
    majListe();
  };
  if (DICTEES.length) charger(0);

  // --- « Ajouter un texte » : la page envoie le texte au relais (Worker Cloudflare, relais/),
  // qui lance le workflow GitHub : audio généré, texte rangé dans textes/, site republié (~3 min)
  const RELAIS = 'https://dictee.dictees-d9709349.workers.dev';
  const etat = (id, msg, erreur) => {
    $(id).hidden = !msg; $(id).textContent = msg || ''; $(id).classList.toggle('erreur', !!erreur);
  };
  $('ajouter').onclick = () => { etat('nv-etat', ''); $('fenetre').showModal(); };
  $('nv-annuler').onclick = () => $('fenetre').close();
  $('nv-choisir').onclick = () => $('nv-fichier').click();

  // .txt / .md lus tels quels ; .docx = zip dont on lit word/document.xml (JSZip chargé à la demande)
  let jszip;
  async function lireDocx(f) {
    jszip ||= await new Promise((ok, ko) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      sc.onload = () => ok(window.JSZip); sc.onerror = () => ko(new Error('JSZip introuvable'));
      document.head.append(sc);
    });
    const xml = await (await jszip.loadAsync(f)).file('word/document.xml').async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    return [...doc.getElementsByTagNameNS(W, 'p')].map(p =>
      [...p.getElementsByTagNameNS(W, '*')].map(el =>
        el.localName === 't' ? el.textContent : el.localName === 'tab' ? '\t' : el.localName === 'br' ? '\n' : ''
      ).join('').trim()
    ).filter(Boolean).join('\n\n');
  }
  $('nv-fichier').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      $('nv-texte').value = /\.docx$/i.test(f.name) ? await lireDocx(f) : await f.text();
      if (!$('nv-titre').value) $('nv-titre').value = f.name.replace(/\.[^.]+$/, '');
      etat('nv-etat', '');
    } catch { etat('nv-etat', 'Ce fichier n’a pas pu être lu. Copie-colle le texte à la place.', true); }
    e.target.value = '';
  };

  $('formulaire').onsubmit = async e => {
    e.preventDefault();
    const texte = $('nv-texte').value.trim(), titre = $('nv-titre').value.trim();
    if (texte.length < 20) return etat('nv-etat', 'Colle un texte ou choisis un fichier.', true);
    $('nv-ok').disabled = true;
    etat('nv-etat', 'Envoi…');
    try {
      const r = await fetch(RELAIS, {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ texte, titre }),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erreur || `erreur ${r.status}`);
      $('fenetre').close();
      $('nv-titre').value = $('nv-texte').value = '';
      const attente = { titre, depuis: Date.now(), ids: DICTEES.map(d => d.id) };
      ecrireAttente(attente);
      surveiller(attente);
    } catch (err) {
      etat('nv-etat', 'Échec : ' + err.message, true);
    } finally {
      $('nv-ok').disabled = false;
    }
  };

  // --- suivi d'un ajout, qui survit à un rafraîchissement :
  // l'ajout lancé depuis ce téléphone est mémorisé (localStorage), et GitHub dit à tout
  // le monde si un ajout tourne ou a échoué ; textes.js relu sans cache dit quand il est en ligne
  const CLE_AJOUT = 'dictees-ajout-en-cours';
  const lireAttente = () => { try { return JSON.parse(localStorage.getItem(CLE_AJOUT)); } catch { return null; } };
  const ecrireAttente = a => {
    try { a ? localStorage.setItem(CLE_AJOUT, JSON.stringify(a)) : localStorage.removeItem(CLE_AJOUT); } catch {}
  };
  async function listeEnLigne() {
    try {
      const js = await (await fetch('textes.js?t=' + Date.now(), { cache: 'no-store' })).text();
      return JSON.parse(js.slice(js.indexOf('['), js.lastIndexOf(']') + 1));
    } catch { return null; }
  }
  function integrer(liste) {                 // la liste en ligne remplace celle chargée (peut-être en cache)
    const id = DICTEES[courant]?.id;
    window.DICTEES = liste;
    construireListe();
    courant = Math.max(0, DICTEES.findIndex(d => d.id === id));
    majListe();
  }
  async function ajoutsGitHub() {
    try {
      const r = await fetch('https://api.github.com/repos/vixrino/porfolio/actions/workflows/dictee.yml/runs?per_page=5');
      return (await r.json()).workflow_runs || [];
    } catch { return []; }
  }

  // dès que le workflow a enregistré la dictée, on la lit directement dans le dépôt GitHub
  // (commit précis, jamais en cache) sans attendre les ~45 s de republication de GitHub Pages
  async function listeDuDepot() {
    try {
      const api = 'https://api.github.com/repos/vixrino/porfolio/commits?path=dictee-d9709349be/textes.js&per_page=1';
      const [{ sha }] = await (await fetch(api, { cache: 'no-store' })).json();
      const base = `https://raw.githubusercontent.com/vixrino/porfolio/${sha}/dictee-d9709349be/`;
      const js = await (await fetch(base + 'textes.js')).text();
      return { base, liste: JSON.parse(js.slice(js.indexOf('['), js.lastIndexOf(']') + 1)) };
    } catch { return null; }
  }

  let surveillance = false;
  function surveiller(attente) {             // attente = ajout lancé ici ; null = lancé par quelqu'un d'autre
    if (surveillance) return;
    surveillance = true;
    const depuis = attente?.depuis || Date.now();
    const connues = new Set(attente?.ids || DICTEES.map(d => d.id));
    const fenetre = attente ? depuis - 120e3 : depuis - 10 * 60e3;   // workflows qui concernent ce suivi
    const nom = attente?.titre ? `« ${attente.titre} »` : 'Une nouvelle dictée';
    const fin = (msg, erreur) => { surveillance = false; if (attente) ecrireAttente(null); etat('suivi', msg, erreur); };
    const tour = async () => {
      const min = Math.floor((Date.now() - depuis) / 60e3);
      etat('suivi', `⏳ ${nom} est en cours d’ajout (${min ? `depuis ${min} min` : 'à l’instant'}, environ 30 s au total)…`);
      let liste = await listeEnLigne();
      let arrivees = liste?.filter(d => !connues.has(d.id)) || [];
      const runs = await ajoutsGitHub();
      if (!arrivees.length && runs.some(r => r.conclusion === 'success' && Date.parse(r.created_at) > fenetre)) {
        const depot = await listeDuDepot();
        arrivees = depot?.liste.filter(d => !connues.has(d.id)) || [];
        try {
          // raw.githubusercontent sert le mp3 en « octet-stream » : on le repasse en audio/mpeg
          await Promise.all(arrivees.map(async d => {
            const mp3 = await (await fetch(depot.base + d.audio)).arrayBuffer();
            d.audio = URL.createObjectURL(new Blob([mp3], { type: 'audio/mpeg' }));
            d.mots = depot.base + d.mots;
          }));
          liste = depot?.liste;
        } catch { arrivees = []; }
      }
      const arrivee = arrivees.pop();
      if (arrivee) {
        integrer(liste);
        if (attente && audio.paused) charger(DICTEES.findIndex(d => d.id === arrivee.id));
        return fin(`✓ « ${arrivee.titre} » est prête.`);
      }
      const actif = runs.some(r => r.status !== 'completed');
      const recents = runs.filter(r => Date.parse(r.created_at) > depuis - 120e3 && r.status === 'completed');
      if (!actif && recents.some(r => r.conclusion !== 'success'))
        return fin(`L’ajout ${attente?.titre ? `de « ${attente.titre} » ` : ''}a échoué. Réessaie.`, true);
      const publieIlYaPeu = runs.some(r => r.conclusion === 'success' && Date.now() - Date.parse(r.updated_at) < 5 * 60e3);
      if (!attente && !actif && !publieIlYaPeu) return fin('');
      if (Date.now() - depuis > 20 * 60e3)
        return fin('La dictée n’est toujours pas arrivée : réessaie de l’ajouter.', true);
      setTimeout(tour, 8e3);
    };
    tour();
  }

  // au chargement : reprendre un ajout en cours, et rattraper une liste en cache périmée
  (async () => {
    const attente = lireAttente();
    if (attente && Date.now() - attente.depuis < 20 * 60e3) return surveiller(attente);
    ecrireAttente(null);
    const liste = await listeEnLigne();
    if (liste && liste.some(d => !DICTEES.some(x => x.id === d.id))) integrer(liste);
    if ((await ajoutsGitHub()).some(r => r.status !== 'completed')) surveiller(null);
  })();

  // l'icône suit toujours l'état réel de l'audio (lecture, pause, fin, retour au début, écran verrouillé)
  const majBouton = () => {
    play.innerHTML = audio.paused ? ICON_PLAY : ICON_PAUSE;
    play.setAttribute('aria-label', audio.paused ? 'Lecture' : 'Pause');
    if (ms) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
  };
  const lire = () => audio.play().catch(majBouton);
  for (const e of ['play', 'playing', 'pause', 'ended', 'emptied']) audio.addEventListener(e, majBouton);
  majBouton();
  play.onclick = () => audio.paused ? lire() : audio.pause();

  $('debut').onclick = () => { audio.pause(); audio.currentTime = 0; majBouton(); };
  $('recul').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 5); };

  // pendant qu'on fait glisser la barre, c'est elle qui donne la position (pas l'audio)
  let glisse = false;
  const majTemps = () => {
    barre.max = audio.duration || 0;
    if (!glisse) barre.value = audio.currentTime;
    $('temps').textContent = `${fmt(glisse ? +barre.value : audio.currentTime)} / ${fmt(audio.duration)}`;
  };
  audio.ontimeupdate = audio.onloadedmetadata = majTemps;

  // surligne le mot en cours de lecture et fait défiler le texte avec la voix
  let boucle = 0;
  function suivre() {
    cancelAnimationFrame(boucle);          // une seule boucle, même après plusieurs seeked
    const t = glisse ? +barre.value : audio.currentTime;
    let lo = 0, hi = mots.length - 1, i = -1;
    while (lo <= hi) {                     // dernier mot commencé avant t
      const m = (lo + hi) >> 1;
      if (mots[m][0] <= t) { i = m; lo = m + 1; } else hi = m - 1;
    }
    if (i !== actif) {
      spans[actif]?.classList.remove('lu');
      spans[i]?.classList.add('lu');
      actif = i;
      const s = spans[i];
      if (s && !$('texte').hidden) {
        const r = s.getBoundingClientRect();
        if (r.top < 80 || r.bottom > innerHeight - 80) s.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
    if (!audio.paused) boucle = requestAnimationFrame(suivre);
  }
  audio.addEventListener('play', suivre);
  audio.addEventListener('seeked', suivre);
  // le doigt sur la barre : le mot surligné suit le glissement ; au lâcher, l'audio y va
  const aller = () => { glisse = false; audio.currentTime = +barre.value; majTemps(); suivre(); };
  const lacher = () => { if (glisse) aller(); };
  barre.addEventListener('pointerdown', () => { glisse = true; });
  barre.addEventListener('touchstart', () => { glisse = true; }, { passive: true });
  for (const e of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) addEventListener(e, lacher);
  barre.oninput = () => { if (glisse) { majTemps(); suivre(); } else aller(); };   // sans doigt : clavier
  barre.onchange = aller;

  $('vitesses').onclick = e => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    vitesse = audio.playbackRate = BASE * b.dataset.v;   // la hauteur de la voix est préservée
    for (const x of $('vitesses').querySelectorAll('[data-v]')) x.setAttribute('aria-pressed', x === b);
  };

  $('voir').onclick = () => {
    const t = $('texte'), ouvert = t.hidden;
    t.hidden = !ouvert;
    $('voir').setAttribute('aria-expanded', ouvert);
    $('voir').textContent = ouvert ? 'Masquer le texte' : 'Afficher le texte (correction)';
  };

  // contrôles de l'écran verrouillé / des écouteurs ; l'<audio> continue écran éteint
  if (ms) {
    const recule = s => { audio.currentTime = Math.max(0, audio.currentTime - s); };
    const actions = {
      play: lire,
      pause: () => audio.pause(),
      seekbackward: e => recule(e.seekOffset || 5),
      seekforward: e => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (e.seekOffset || 5)); },
      seekto: e => { audio.currentTime = e.seekTime; },
      previoustrack: () => { audio.currentTime = 0; },
    };
    for (const [a, f] of Object.entries(actions)) {
      try { navigator.mediaSession.setActionHandler(a, f); } catch {}
    }
    const etat = () => {
      if (!audio.duration) return;
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime }); } catch {}
    };
    audio.addEventListener('loadedmetadata', etat);
    audio.addEventListener('ratechange', etat);
    audio.addEventListener('seeked', etat);
  }

  // après un clic, le bouton garde le focus et Espace le re-cliquerait
  document.addEventListener('click', e => e.target.closest('button')?.blur());
  document.onkeydown = e => {
    if (e.code === 'Escape') ouvrir(false);
    if (e.target.matches('input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); play.click(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); $('recul').click(); }
  };
</script>
</body>
</html>
