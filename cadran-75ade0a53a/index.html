<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Le Cadran</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #efe9dd; --txt: #1d1c1a; --mute: #6f6a60; --line: #d9d1c1;
    --accent: #1f3b5c; --accent-txt: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121417; --txt: #ecebe7; --mute: #9a968d; --line: #2c3036;
      --accent: #e9b949; --accent-txt: #1a1405;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 560px; min-height: 100%; margin: 0 auto; padding: 24px 16px 32px;
    display: flex; flex-direction: column; gap: 18px;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  button { font: inherit; color: inherit; }

  /* l'objet : même rendu en clair et en sombre, comme un vrai plateau */
  .boitier {
    background: linear-gradient(#24303d, #19222c);
    border-radius: 28px; padding: 18px 14px 14px;
    box-shadow: 0 14px 30px rgb(0 0 0 / .28), inset 0 1px 0 rgb(255 255 255 / .08);
  }
  svg#cadran { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  svg#cadran.drag { cursor: grab; }
  svg#cadran.drag:active { cursor: grabbing; }
  #cadran:focus { outline: none; }
  #cadran:focus-visible #bord { stroke: #e9b949; }

  #volet {
    transform-box: view-box; transform-origin: 160px 170px;
    transition: transform .9s cubic-bezier(.6, 0, .25, 1);
  }
  #volet.ouvert { transform: rotate(-180deg); }
  #aiguille { transition: opacity .25s; }

  .resultat { font-size: 24px; font-weight: 700; text-align: center; margin: 0; }
  .consigne { margin: 0; text-align: center; color: var(--mute); min-height: 3em; }
  .consigne b { color: var(--txt); }

  .actions { display: flex; gap: 10px; justify-content: center; margin-top: auto; }
  .main-btn {
    border: 0; border-radius: 14px; padding: 15px 22px; cursor: pointer;
    background: var(--accent); color: var(--accent-txt); font-weight: 700; font-size: 17px;
    flex: 1 1 auto; max-width: 360px;
  }
  .main-btn:disabled { opacity: .5; cursor: default; }

  .rideau {
    position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center;
    padding: 24px; text-align: center; z-index: 5;
  }
  .rideau[hidden] { display: none; }
  .rideau p { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
</style>
</head>
<body>
<main>
  <h1>Le Cadran</h1>

  <div class="boitier">
    <svg id="cadran" viewBox="0 0 320 184" role="slider" aria-label="Aiguille du cadran"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <defs>
        <clipPath id="haut"><rect x="0" y="0" width="320" height="170"/></clipPath>
        <radialGradient id="face" cx="50%" cy="100%" r="100%">
          <stop offset="0" stop-color="#fbf5e8"/>
          <stop offset="1" stop-color="#e8dcc3"/>
        </radialGradient>
        <linearGradient id="voletGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#3d6f8f"/>
          <stop offset="1" stop-color="#2a5370"/>
        </linearGradient>
      </defs>

      <g clip-path="url(#haut)">
        <path d="M14 170 A146 146 0 0 1 306 170 Z" fill="url(#face)"/>
        <g id="graduations" stroke="#8b7d63" stroke-width="1.5" stroke-linecap="round"></g>
        <g id="cible"></g>
        <g id="volet">
          <path d="M12 170 A148 148 0 0 1 308 170 Z" fill="url(#voletGrad)"/>
          <path d="M40 170 A120 120 0 0 1 280 170" fill="none" stroke="rgb(255 255 255 / .12)" stroke-width="2"/>
          <path d="M70 170 A90 90 0 0 1 250 170" fill="none" stroke="rgb(255 255 255 / .08)" stroke-width="2"/>
          <rect x="146" y="30" width="28" height="8" rx="4" fill="rgb(255 255 255 / .35)"/>
        </g>
      </g>
      <path id="bord" d="M14 170 A146 146 0 0 1 306 170" fill="none" stroke="#0e141a" stroke-width="7"/>
      <rect x="4" y="168" width="312" height="14" rx="7" fill="#0e141a"/>

      <g id="aiguille">
        <line x1="160" y1="170" x2="160" y2="34" stroke="#c8372d" stroke-width="5" stroke-linecap="round"/>
        <circle cx="160" cy="34" r="6" fill="#c8372d"/>
      </g>
      <circle cx="160" cy="170" r="17" fill="#c8372d"/>
      <circle cx="160" cy="170" r="17" fill="none" stroke="rgb(0 0 0 / .25)" stroke-width="2"/>
      <circle cx="155" cy="165" r="5" fill="rgb(255 255 255 / .35)"/>
    </svg>
  </div>

  <p class="resultat" id="resultat" hidden></p>
  <p class="consigne" id="consigne"></p>

  <div class="actions" id="actions"></div>
</main>

<div class="rideau" id="rideau" hidden>
  <div>
    <p id="rideau-txt"></p>
    <button class="main-btn" id="rideau-btn"></button>
  </div>
</div>

<script>
(() => {
  const CX = 160, CY = 170, R = 146;
  const $ = (id) => document.getElementById(id);
  const svg = $("cadran"), gCible = $("cible"), aig = $("aiguille"), volet = $("volet");
  const consigne = $("consigne"), resultat = $("resultat"), actions = $("actions"), rideau = $("rideau");
  const DUREE_VOLET = 900;

  // angle a : 0 = tout à gauche, 180 = tout à droite
  const pt = (a, r = R) => {
    const t = (a * Math.PI) / 180;
    return [CX - r * Math.cos(t), CY - r * Math.sin(t)];
  };
  const part = (a1, a2) => {
    a1 = Math.max(0, a1); a2 = Math.min(180, a2);
    const [x1, y1] = pt(a1), [x2, y2] = pt(a2);
    return `M${CX} ${CY} L${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
  };

  let gr = "";
  for (let a = 0; a <= 180; a += 9) {
    const long = a % 45 === 0;
    const [x1, y1] = pt(a, R - (long ? 14 : 7)), [x2, y2] = pt(a, R - 2);
    gr += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  $("graduations").innerHTML = gr;

  let cible = 90, angle = 90, phase = "pret";

  // 5 bandes de 7° : 2 3 4 3 2
  const W = 7;
  const BANDES = [[-2.5, 2, "#e9b949"], [-1.5, 3, "#e07a2e"], [-0.5, 4, "#b8321f"], [0.5, 3, "#e07a2e"], [1.5, 2, "#e9b949"]];
  function dessinerCible() {
    gCible.innerHTML = BANDES.map(([k, n, coul]) => {
      const a1 = cible + k * W, mid = a1 + W / 2;
      const [x, y] = pt(mid, R - 22);
      return `<path d="${part(a1, a1 + W)}" fill="${coul}" stroke="#fbf5e8" stroke-width=".8"/>
        <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${(mid - 90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"
          text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="13" font-weight="800"
          font-family="system-ui, sans-serif">${n}</text>`;
    }).join("");
  }

  const ouvrir = () => volet.classList.add("ouvert");
  const fermer = () => volet.classList.remove("ouvert");

  function placerAiguille(a) {
    angle = Math.max(0, Math.min(180, a));
    aig.setAttribute("transform", `rotate(${angle - 90} ${CX} ${CY})`);
    svg.setAttribute("aria-valuenow", Math.round((angle / 180) * 100));
  }
  const montrerAiguille = (v) => { aig.style.opacity = v ? 1 : 0; };

  function bouton(txt, fn) {
    const b = document.createElement("button");
    b.className = "main-btn"; b.textContent = txt;
    b.onclick = () => { b.disabled = true; fn(); };
    actions.appendChild(b);
  }

  function passer(txt, btn, fn) {
    $("rideau-txt").textContent = txt;
    $("rideau-btn").textContent = btn;
    $("rideau-btn").onclick = () => { rideau.hidden = true; fn(); };
    rideau.hidden = false;
    $("rideau-btn").focus();
  }

  function aller(p) {
    phase = p;
    actions.innerHTML = "";
    resultat.hidden = true;
    svg.classList.toggle("drag", p === "devine");
    svg.tabIndex = p === "devine" ? 0 : -1;

    if (p === "pret") {
      fermer(); montrerAiguille(false);
      consigne.innerHTML = "Donne le téléphone à la personne qui <b>fait deviner</b>.";
      bouton("Voir la cible", () => passer("Seule la personne qui fait deviner regarde l'écran.", "C'est bon, ouvrir", () => {
        cible = 2.5 * W + Math.random() * (180 - 5 * W);
        dessinerCible();
        aller("cible");
        ouvrir();
      }));
    }

    if (p === "cible") {
      montrerAiguille(false);
      consigne.innerHTML = "Mémorise la cible et prépare <b>ton indice</b>.";
      bouton("Fermer le cadran", () => {
        fermer();
        setTimeout(() => passer("Cadran fermé. Donne le téléphone aux autres et dis ton indice.", "On devine", () => {
          placerAiguille(90);
          aller("devine");
        }), DUREE_VOLET);
      });
    }

    if (p === "devine") {
      fermer(); montrerAiguille(true);
      consigne.innerHTML = "Discutez, puis <b>tournez l'aiguille</b> vers la cible.";
      bouton("Révéler", () => {
        ouvrir();
        setTimeout(() => aller("revele"), DUREE_VOLET);
      });
    }

    if (p === "revele") {
      montrerAiguille(true);
      const ecart = Math.abs(angle - cible);
      resultat.textContent =
        ecart <= W / 2 ? "4 — en plein dans le mille !" :
        ecart <= 1.5 * W ? "3 — tout près !" :
        ecart <= 2.5 * W ? "2 — dans la zone" : "Raté";
      resultat.hidden = false;
      consigne.innerHTML = cible > angle + W / 2 ? "La cible était plus à droite." :
                           cible < angle - W / 2 ? "La cible était plus à gauche." : "";
      bouton("Manche suivante", () => {
        fermer(); montrerAiguille(false);
        setTimeout(() => aller("pret"), DUREE_VOLET);
      });
    }
  }

  // ---- tourner l'aiguille ----
  function angleDepuis(e) {
    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 320;
    const y = ((e.clientY - r.top) / r.height) * 184;
    const dx = x - CX, dy = CY - y;
    if (dy <= 0) return dx < 0 ? 0 : 180;
    return (Math.atan2(dy, -dx) * 180) / Math.PI;
  }
  let tire = false;
  svg.addEventListener("pointerdown", (e) => {
    if (phase !== "devine") return;
    tire = true; svg.setPointerCapture(e.pointerId);
    placerAiguille(angleDepuis(e));
  });
  svg.addEventListener("pointermove", (e) => { if (tire) placerAiguille(angleDepuis(e)); });
  const lacher = () => { tire = false; };
  svg.addEventListener("pointerup", lacher);
  svg.addEventListener("pointercancel", lacher);
  svg.addEventListener("keydown", (e) => {
    if (phase !== "devine") return;
    const pas = e.shiftKey ? 10 : 2;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { placerAiguille(angle - pas); e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { placerAiguille(angle + pas); e.preventDefault(); }
  });

  placerAiguille(90);
  aller("pret");
})();
</script>
</body>
</html>
