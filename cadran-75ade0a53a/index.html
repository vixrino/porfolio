<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3b1366">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadran">
<link rel="manifest" href="manifest.webmanifest">
<title>Le Cadran</title>
<style>
  /* thème violet fixe : c'est le plateau du jeu, pas une page de texte */
  :root {
    color-scheme: dark;
    --txt: #fff; --mute: #dccbf5; --line: rgb(255 255 255 / .28);
    --accent: #ffd166; --accent-txt: #2a0b4d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    -webkit-user-select: none; user-select: none;
    margin: 0; color: var(--txt);
    background: #3b1366 radial-gradient(120% 90% at 50% 0%, #7b3fc4 0%, #4a1a80 45%, #26093f 100%) fixed;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 1000px; height: 100svh; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 18px;
  }
  .cote { display: contents; }
  h1 { order: -1; font-size: 22px; margin: 0; letter-spacing: .04em; text-shadow: 0 2px 12px rgb(0 0 0 / .3); }
  button { font: inherit; color: inherit; }

  .boitier {
    max-width: 100%; margin: 0 auto;
    background: linear-gradient(#2d0f52, #1a0633);
    border-radius: 28px; padding: 18px 14px 14px;
    box-shadow: 0 18px 40px rgb(15 0 35 / .55), 0 0 0 1px rgb(255 255 255 / .08), inset 0 1px 0 rgb(255 255 255 / .12);
  }
  svg#cadran { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  svg#cadran.drag { cursor: grab; }
  svg#cadran.drag:active { cursor: grabbing; }
  #cadran:focus { outline: none; }
  #cadran:focus-visible #bord { stroke: #ffd166; }

  #volet {
    transform-box: view-box; transform-origin: 160px 170px;
    transition: transform .9s cubic-bezier(.6, 0, .25, 1);
  }
  #volet.ouvert { transform: rotate(-180deg); }
  #aiguille { transition: opacity .25s; }

  .resultat { font-size: 24px; font-weight: 800; text-align: center; margin: 0; line-height: 1.3; min-height: 1.3em; color: #ffd166; }
  .resultat.vide { visibility: hidden; }
  .consigne { margin: 0; text-align: center; color: var(--mute); min-height: 3em; }
  .consigne b { color: var(--txt); }

  .mots { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .mot {
    flex: 0 1 48%; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 8px 10px;
    border-radius: 10px; font-weight: 800; font-size: 15px; line-height: 1.25;
    background: #fbf4ff; color: #2a0b4d; box-shadow: 0 3px 0 #120324;
  }
  .mot .champ {
    flex: 1; min-width: 0; overflow-wrap: anywhere; min-height: 1.25em;
    -webkit-user-select: text; user-select: text;
  }
  .mot.d .champ { text-align: right; }
  .mot .champ[contenteditable="plaintext-only"], .mot .champ[contenteditable="true"] {
    text-decoration: underline dashed #a27ad6 1.5px; text-underline-offset: 3px; cursor: text;
  }
  .mot .champ:focus { outline: none; text-decoration-style: solid; }

  .actions { display: flex; gap: 10px; justify-content: center; margin-top: auto; }
  .main-btn {
    border: 0; border-radius: 14px; padding: 15px 22px; cursor: pointer;
    background: var(--accent); color: var(--accent-txt); font-weight: 800; font-size: 17px;
    flex: 1 1 auto; max-width: 360px; box-shadow: 0 4px 0 #c98f1c;
  }
  .main-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #c98f1c; }
  .main-btn:disabled { opacity: .5; cursor: default; }
  .ghost {
    border: 1px solid var(--line); background: rgb(255 255 255 / .08); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; font-weight: 700;
  }
  .ghost:hover { background: rgb(255 255 255 / .14); }

  @media (max-height: 560px) { main { padding-top: 10px; padding-bottom: 12px; gap: 10px; } h1 { display: none; } }

  @media (min-width: 800px) {
    main { padding-top: 32px; gap: 22px; }
    h1 { font-size: 28px; }
    .boitier { border-radius: 40px; padding: 28px 24px 22px; }
    .mot { font-size: 22px; padding: 12px 16px; border-radius: 14px; }
    .resultat { font-size: 32px; }
    .consigne { font-size: 18px; }
    .main-btn, .ghost { font-size: 19px; padding: 16px 28px; }
  }

  /* écran large et peu haut (PC, téléphone couché) : texte et boutons à côté du cadran */
  @media (min-width: 700px) and (min-aspect-ratio: 13/10) {
    main {
      max-width: 1500px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 24vw, 320px);
      align-items: center; gap: 28px;
      padding: max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    .cote { display: flex; flex-direction: column; gap: 18px; }
    .resultat, .consigne { text-align: left; }
    .actions { flex-direction: column; margin-top: 8px; }
    .main-btn, .ghost { max-width: none; flex: none; }
  }
  @media (min-width: 700px) and (min-aspect-ratio: 13/10) and (max-height: 560px) {
    h1 { display: none; }
    .cote { gap: 10px; }
    .consigne { min-height: 0; font-size: 15px; }
    .main-btn, .ghost { padding: 12px 16px; font-size: 16px; }
    .boitier { border-radius: 24px; padding: 12px 12px 10px; }
    .mot { font-size: 16px; padding: 6px 10px; border-radius: 10px; }
    .mots { margin-top: 6px; }
  }

  .pe {
    position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    background: rgb(255 255 255 / .1); color: #fff; cursor: pointer; display: grid; place-items: center;
  }
  .pe svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pe[hidden] { display: none; }

  .voile {
    position: fixed; inset: 0; z-index: 6; display: none; place-items: center; text-align: center;
    padding: 24px; background: #3b1366 radial-gradient(120% 90% at 50% 0%, #7b3fc4 0%, #4a1a80 45%, #26093f 100%);
  }
  .voile p { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
  .voile small { display: block; color: var(--mute); font-size: 15px; margin-bottom: 22px; max-width: 320px; }
  .voile .tel { width: 72px; height: 72px; margin: 0 auto 18px; animation: tourne 2.4s ease-in-out infinite; }
  .voile .tel svg { width: 100%; height: 100%; fill: none; stroke: #ffd166; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes tourne { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  .voile .actions { flex-direction: column; align-items: center; }
  .voile .ghost { border: 0; background: none; text-decoration: underline; color: var(--mute); font-weight: 600; padding: 8px; }
  /* téléphone tenu droit : on demande de le tourner */
  @media (orientation: portrait) and (pointer: coarse) and (max-width: 600px) {
    body:not(.portrait-ok) .voile.rotation { display: grid; }
  }
</style>
</head>
<body>
<button class="pe" id="pe" aria-label="Plein écran" title="Plein écran">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<div class="voile rotation" id="voile-rotation">
  <div>
    <div class="tel"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg></div>
    <p>Tourne ton téléphone</p>
    <small>Le jeu se joue à l'horizontale.</small>
    <div class="actions">
      <button class="main-btn" id="rot-pe">Plein écran à l'horizontale</button>
      <button class="ghost" id="rot-ok">Jouer quand même à la verticale</button>
    </div>
  </div>
</div>

<main>

  <div class="boitier">
    <svg id="cadran" viewBox="0 0 320 184" role="slider" aria-label="Aiguille du cadran"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <defs>
        <clipPath id="haut"><rect x="0" y="0" width="320" height="170"/></clipPath>
        <radialGradient id="face" cx="50%" cy="100%" r="100%">
          <stop offset="0" stop-color="#fdf8ff"/>
          <stop offset="1" stop-color="#e6d5fb"/>
        </radialGradient>
        <linearGradient id="voletGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#9b5de5"/>
          <stop offset="1" stop-color="#5b21b6"/>
        </linearGradient>
      </defs>

      <g clip-path="url(#haut)">
        <path d="M14 170 A146 146 0 0 1 306 170 Z" fill="url(#face)"/>
        <g id="graduations" stroke="#9d7cc9" stroke-width="1.5" stroke-linecap="round"></g>
        <g id="cible"></g>
        <g id="volet">
          <path d="M12 170 A148 148 0 0 1 308 170 Z" fill="url(#voletGrad)"/>
          <path d="M40 170 A120 120 0 0 1 280 170" fill="none" stroke="rgb(255 255 255 / .12)" stroke-width="2"/>
          <path d="M70 170 A90 90 0 0 1 250 170" fill="none" stroke="rgb(255 255 255 / .08)" stroke-width="2"/>
          <rect x="146" y="30" width="28" height="8" rx="4" fill="rgb(255 255 255 / .35)"/>
        </g>
      </g>
      <path id="bord" d="M14 170 A146 146 0 0 1 306 170" fill="none" stroke="#12032a" stroke-width="7"/>
      <rect x="4" y="168" width="312" height="14" rx="7" fill="#12032a"/>

      <g id="aiguille">
        <line x1="160" y1="170" x2="160" y2="34" stroke="#e8364f" stroke-width="5" stroke-linecap="round"/>
        <circle cx="160" cy="34" r="6" fill="#e8364f"/>
      </g>
      <circle cx="160" cy="170" r="17" fill="#e8364f"/>
      <circle cx="160" cy="170" r="17" fill="none" stroke="rgb(0 0 0 / .25)" stroke-width="2"/>
      <circle cx="155" cy="165" r="5" fill="rgb(255 255 255 / .35)"/>
    </svg>
    <div class="mots">
      <div class="mot g"><span aria-hidden="true">←</span><span class="champ" id="mot-g" role="textbox" aria-label="Mot de gauche"></span></div>
      <div class="mot d"><span class="champ" id="mot-d" role="textbox" aria-label="Mot de droite"></span><span aria-hidden="true">→</span></div>
    </div>
  </div>

  <div class="cote">
    <h1>Le Cadran</h1>
    <p class="resultat vide" id="resultat" aria-live="polite"></p>
    <p class="consigne" id="consigne"></p>
    <div class="actions" id="actions"></div>
  </div>
</main>


<script>
(() => {
  const CX = 160, CY = 170, R = 146;
  const $ = (id) => document.getElementById(id);
  const svg = $("cadran"), gCible = $("cible"), aig = $("aiguille"), volet = $("volet");
  const consigne = $("consigne"), resultat = $("resultat"), actions = $("actions");
  const DUREE_VOLET = 900;

  // angle a : 0 = tout à gauche, 180 = tout à droite
  const pt = (a, r = R) => {
    const t = (a * Math.PI) / 180;
    return [CX - r * Math.cos(t), CY - r * Math.sin(t)];
  };
  const part = (a1, a2) => {
    a1 = Math.max(0, a1); a2 = Math.min(180, a2);
    const [x1, y1] = pt(a1), [x2, y2] = pt(a2);
    return `M${CX} ${CY} L${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
  };

  let gr = "";
  for (let a = 0; a <= 180; a += 9) {
    const long = a % 45 === 0;
    const [x1, y1] = pt(a, R - (long ? 14 : 7)), [x2, y2] = pt(a, R - 2);
    gr += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  $("graduations").innerHTML = gr;

  let cible = 90, angle = 90, phase = "pret";

  // 5 bandes de 7° : 2 3 4 3 2
  const W = 7;
  const BANDES = [[-2.5, 2, "#ffd166"], [-1.5, 3, "#ff7aa8"], [-0.5, 4, "#6b6f76"], [0.5, 3, "#ff7aa8"], [1.5, 2, "#ffd166"]];
  function dessinerCible() {
    gCible.innerHTML = BANDES.map(([k, n, coul]) => {
      // bandes coupées au bord du cadran : la cible peut aller de 0 à 180
      const a1 = Math.max(0, cible + k * W), a2 = Math.min(180, cible + (k + 1) * W);
      if (a2 - a1 <= 0) return "";
      const mid = (a1 + a2) / 2;
      const [x, y] = pt(mid, R - 22);
      const forme = `<path d="${part(a1, a2)}" fill="${coul}" stroke="#fdf8ff" stroke-width=".8"/>`;
      if (a2 - a1 < 3.5) return forme;
      return `${forme}
        <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${(mid - 90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"
          text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="13" font-weight="800"
          font-family="system-ui, sans-serif">${n}</text>`;
    }).join("");
  }

  const ouvrir = () => volet.classList.add("ouvert");
  const fermer = () => volet.classList.remove("ouvert");

  function placerAiguille(a) {
    angle = Math.max(0, Math.min(180, a));
    aig.setAttribute("transform", `rotate(${angle - 90} ${CX} ${CY})`);
    svg.setAttribute("aria-valuenow", Math.round((angle / 180) * 100));
  }
  const montrerAiguille = (v) => { aig.style.opacity = v ? 1 : 0; };

  // paires pour adultes (18+)
  const PAIRES = [
    ["Pas sexy du tout", "Ultra sexy"],
    ["Tue-l'amour", "Très excitant"],
    ["Sobre", "Complètement bourré"],
    ["Premier date raté", "Premier date parfait"],
    ["Ok au premier rendez-vous", "Jamais au premier rendez-vous"],
    ["Vanille", "Très coquin"],
    ["Honteux", "Assumé"],
    ["Red flag", "Green flag"],
    ["Plan d'un soir", "Relation sérieuse"],
    ["Ex à oublier", "Ex à recontacter"],
    ["Gênant au lit", "Talent caché au lit"],
    ["Se dit à sa mère", "Ne se dit jamais à sa mère"],
    ["Message à 3 h : mauvaise idée", "Message à 3 h : bonne idée"],
    ["Péché mignon", "Péché mortel"],
    ["Romantique", "Pervers"],
    ["Pas jaloux", "Jaloux maladif"],
    ["Légal", "Illégal"],
    ["Pardonnable", "Impardonnable"],
    ["Infidélité mineure", "Trahison absolue"],
    ["Turn-off", "Turn-on"],
    ["Tenue de soirée sage", "Tenue de soirée osée"],
    ["Ça se fait en public", "Ça se fait en privé"],
    ["Secret à garder", "Secret à balancer"],
    ["Signe qu'il/elle te kiffe", "Signe qu'il/elle s'en fout"],
    ["Sujet tabou", "Sujet normal"],
    ["Parfait pour un date", "À fuir pour un date"],
    ["Odeur sexy", "Odeur tue-l'amour"],
    ["Fantasme courant", "Fantasme rare"],
    ["Bon pour le couple", "Détruit le couple"],
    ["Appli de rencontre : swipe gauche", "Swipe droite direct"],
    ["Mauvais baiser", "Baiser parfait"],
    ["Normal à 30 ans", "Inquiétant à 30 ans"],
    ["Cringe", "Charismatique"],
    ["Excuse bidon", "Excuse crédible"],
    ["Rupture propre", "Rupture catastrophique"],
    ["Flirt innocent", "Drague lourde"],
    ["Tenue de nuit tue-l'amour", "Lingerie de compétition"],
    ["Position facile", "Position de contorsionniste"],
    ["Préliminaires zappés", "Préliminaires d'une heure"],
    ["Rapide", "Marathon"],
    ["Bruyant au lit", "Silencieux au lit"],
    ["Endroit normal pour le faire", "Endroit très risqué pour le faire"],
    ["Jouet coquin basique", "Jouet coquin intimidant"],
    ["Plan à trois : jamais", "Plan à trois : pourquoi pas"],
    ["Sexto raté", "Sexto de génie"],
    ["Ça m'excite", "Ça me dégoûte"],
    ["Fantasme avouable", "Fantasme inavouable"],
    ["Prénom sexy", "Prénom tue-l'amour"],
    ["Métier sexy", "Métier pas sexy"],
    ["Accent sexy", "Accent tue-l'amour"],
    ["Partie du corps sexy", "Partie du corps pas sexy"],
    ["Âge idéal pour se caser", "Âge où c'est trop tard"],
    ["Rencard au resto", "Rencard Netflix and chill"],
    ["Ghosting acceptable", "Ghosting impardonnable"],
    ["Situationship", "Couple officiel"],
    ["Ex qu'on recroise avec plaisir", "Ex qu'on fuit en courant"],
    ["Mensonge pieux", "Gros mytho"],
    ["Raison de rompre valable", "Raison de rompre ridicule"],
    ["Cadeau de couple nul", "Cadeau de couple parfait"],
    ["Belle-famille de rêve", "Belle-famille cauchemar"],
    ["Dispute de couple futile", "Dispute de couple grave"],
    ["Petite jalousie", "Crise de jalousie"],
    ["Mot doux mignon", "Surnom gênant"],
    ["Couple fusionnel", "Couple libre"],
    ["Bio Tinder réussie", "Bio Tinder catastrophique"],
    ["Photo de profil honnête", "Photo de profil mensongère"],
    ["Ouverture de conversation géniale", "Ouverture de conversation flippante"],
    ["Story à poster", "Story à ne jamais poster"],
    ["Malaise léger", "Malaise sur 10 ans"],
    ["Amende méritée", "Amende injuste"],
    ["Bêtise d'ado", "Crime de guerre"],
    ["Pote de confiance", "Pote balance"],
    ["Rumeur crédible", "Rumeur absurde"],
    ["Historique de recherche normal", "Historique à brûler"],
    ["Série romantique", "Série trash"],
    ["Chanson sexy", "Chanson ridicule"],
    ["Défaut mignon", "Défaut rédhibitoire"],
    ["Manie charmante", "Manie insupportable"],
    ["Habitude sale", "Habitude saine"],
    ["Péché acceptable", "Péché capital"],
    ["Coupable", "Innocent"],
    ["Idée de 2 h du matin géniale", "Idée de 2 h du matin regrettable"],
    ["Tatouage assumé", "Tatouage regretté"],
    ["Blague de beauf", "Humour raffiné"],
    ["Insulte affectueuse", "Insulte qui fait mal"],
    ["Rendez-vous chez les beaux-parents réussi", "Rendez-vous chez les beaux-parents raté"],
    ["Action ou vérité soft", "Action ou vérité hardcore"],
  ];

  // "plaintext-only" évite le collage de mise en forme ; repli sur "true" sinon
  const editable = (() => { const t = document.createElement("span"); t.contentEditable = "plaintext-only"; return t.contentEditable === "plaintext-only" ? "plaintext-only" : "true"; })();
  for (const m of [document.getElementById("mot-g"), document.getElementById("mot-d")]) {
    m.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); m.blur(); } });
    m.addEventListener("input", () => { if (m.textContent.length > 40) m.textContent = m.textContent.slice(0, 40); });
  }
  let paquet = [];
  function nouvellePaire() {
    if (!paquet.length) paquet = shuffle(PAIRES.map((_, i) => i));
    const [a, b] = PAIRES[paquet.pop()];
    $("mot-g").textContent = a;
    $("mot-d").textContent = b;
    if (typeof ajuster === "function") ajuster();
  }
  function shuffle(t) {
    for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
    return t;
  }

  function bouton(txt, fn, cls = "main-btn", garder = false) {
    const b = document.createElement("button");
    b.className = cls; b.textContent = txt;
    b.onclick = () => { if (!garder) b.disabled = true; fn(); };
    actions.appendChild(b);
  }

  function aller(p) {
    phase = p;
    actions.innerHTML = "";
    resultat.classList.add("vide");
    svg.classList.toggle("drag", p === "devine");
    svg.tabIndex = p === "devine" ? 0 : -1;

    for (const m of [$("mot-g"), $("mot-d")]) {
      if (p === "pret") m.setAttribute("contenteditable", editable);
      else { m.removeAttribute("contenteditable"); m.blur(); }
    }
    if (p === "pret") {
      fermer(); montrerAiguille(false);
      gCible.innerHTML = "";
      consigne.innerHTML = "Touche un mot pour le changer, puis donne le téléphone à la personne qui <b>fait deviner</b>.";
      bouton("Autre paire", nouvellePaire, "ghost", true);
      bouton("Voir la cible", () => {
        cible = Math.random() * 180;
        dessinerCible();
        aller("cible");
        ouvrir();
      });
    }

    if (p === "cible") {
      montrerAiguille(false);
      consigne.innerHTML = "Mémorise la cible et prépare <b>ton indice</b>.";
      bouton("Fermer le cadran", () => {
        placerAiguille(90);
        aller("devine");
      });
    }

    if (p === "devine") {
      fermer(); montrerAiguille(true);
      setTimeout(() => { if (phase === "devine") gCible.innerHTML = ""; }, DUREE_VOLET);
      consigne.innerHTML = "Discutez, puis <b>tournez l'aiguille</b> vers la cible.";
      bouton("Révéler", () => {
        dessinerCible();
        ouvrir();
        setTimeout(() => aller("revele"), DUREE_VOLET);
      });
    }

    if (p === "revele") {
      montrerAiguille(true);
      const ecart = Math.abs(angle - cible);
      resultat.textContent =
        ecart <= W / 2 ? "4 — en plein dans le mille !" :
        ecart <= 1.5 * W ? "3 — tout près !" :
        ecart <= 2.5 * W ? "2 — dans la zone" : "Raté";
      resultat.classList.remove("vide");
      consigne.innerHTML = cible > angle + W / 2 ? "La cible était plus à droite." :
                           cible < angle - W / 2 ? "La cible était plus à gauche." : "";
      bouton("Manche suivante", () => {
        nouvellePaire();
        fermer(); montrerAiguille(false);
        setTimeout(() => aller("pret"), DUREE_VOLET);
      });
    }
  }

  // ---- tourner l'aiguille ----
  function angleDepuis(e) {
    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 320;
    const y = ((e.clientY - r.top) / r.height) * 184;
    const dx = x - CX, dy = CY - y;
    if (dy <= 0) return dx < 0 ? 0 : 180;
    return (Math.atan2(dy, -dx) * 180) / Math.PI;
  }
  let tire = false;
  svg.addEventListener("pointerdown", (e) => {
    if (phase !== "devine") return;
    tire = true; svg.setPointerCapture(e.pointerId);
    placerAiguille(angleDepuis(e));
  });
  svg.addEventListener("pointermove", (e) => { if (tire) placerAiguille(angleDepuis(e)); });
  const lacher = () => { tire = false; };
  svg.addEventListener("pointerup", lacher);
  svg.addEventListener("pointercancel", lacher);
  svg.addEventListener("keydown", (e) => {
    if (phase !== "devine") return;
    const pas = e.shiftKey ? 10 : 2;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { placerAiguille(angle - pas); e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { placerAiguille(angle + pas); e.preventDefault(); }
  });

  // le cadran prend toute la place restante, sans jamais faire défiler la page
  const main = document.querySelector("main"), boitier = document.querySelector(".boitier");
  function ajuster() {
    svg.style.width = "0px"; svg.style.height = "0px"; main.style.height = "auto";
    const ms = getComputedStyle(main), cs = getComputedStyle(boitier);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const cote = ms.display === "grid";
    // hauteur prise par tout sauf le dessin
    const fixe = cote ? boitier.offsetHeight + parseFloat(ms.paddingTop) + parseFloat(ms.paddingBottom) : main.scrollHeight;
    main.style.height = "";
    const colonne = cote ? parseFloat(ms.gridTemplateColumns) : main.clientWidth - parseFloat(ms.paddingLeft) - parseFloat(ms.paddingRight);
    const largeurMax = colonne - padX;
    const hauteurLibre = window.innerHeight - fixe;
    const w = Math.max(160, Math.min(largeurMax, (hauteurLibre * 320) / 184));
    svg.style.width = w + "px"; svg.style.height = (w * 184) / 320 + "px";
  }
  window.addEventListener("resize", ajuster);

  // ---- plein écran + paysage ----
  const racine = document.documentElement;
  const peDispo = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const autonome = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone === true;
  const enPE = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  async function pleinEcran() {
    if (peDispo) {
      try {
        if (enPE()) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
        await (racine.requestFullscreen || racine.webkitRequestFullscreen).call(racine, { navigationUI: "hide" });
        try { await screen.orientation.lock("landscape"); } catch {}
      } catch {}
    }
  }
  const pe = $("pe");
  // iPhone : Safari n'autorise pas le plein écran d'une page, donc pas de bouton qui ne marche pas
  pe.hidden = autonome || !peDispo;
  pe.onclick = pleinEcran;
  $("rot-pe").onclick = pleinEcran;
  $("rot-pe").hidden = !peDispo;
  $("rot-ok").onclick = () => document.body.classList.add("portrait-ok");
  const majPE = () => {
    pe.setAttribute("aria-label", enPE() ? "Quitter le plein écran" : "Plein écran");
    setTimeout(ajuster, 150);
  };
  document.addEventListener("fullscreenchange", majPE);
  document.addEventListener("webkitfullscreenchange", majPE);
  for (const m of [$("mot-g"), $("mot-d")]) m.addEventListener("input", ajuster);

  placerAiguille(90);
  nouvellePaire();
  aller("pret");
  ajuster();
  if (document.fonts) document.fonts.ready.then(ajuster);
})();
</script>
</body>
</html>
